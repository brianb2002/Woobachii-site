  // ---------- interaction ----------
  function hitMeshes() {
    const list = [];
    for (const P of allPanels) {
      let n = P.group, vis = true;
      while (n) { if (!n.visible) { vis = false; break; } n = n.parent; }
      if (vis) list.push(P.mesh);
    }
    return list;
  }
  function panelOf(mesh) { return allPanels.find((P) => P.mesh === mesh) || null; }
  function actionFor(mesh, uv) { const P = panelOf(mesh); return P && uv ? P.hit(uv) : null; }
  function pointFor(action) {
    for (const P of allPanels) {
      const pt = P.pointFor(action);
      if (pt) return pt;
    }
    return null;
  }
  function dispatch(action) {
    if (!action) return false;
    if (action.startsWith('tile:')) handlers.onSelectSymbol(action.slice(5));
    else if (action.startsWith('mode:')) handlers.onMode(action.slice(5));
    else if (action.startsWith('cap:')) handlers.onCap(parseInt(action.slice(4), 10));
    else if (action.startsWith('view:')) handlers.onView(action.slice(5));
    else if (action === 'btn:performance') { setModal(openModalName === 'performance' ? null : 'performance'); if (openModalName === 'performance' && desk) drawPerf(desk); }
    else if (action === 'btn:journal') { setModal(openModalName === 'journal' ? null : 'journal'); if (openModalName === 'journal') drawJournal(); }
    else if (action === 'btn:rehearsal') handlers.onRehearsal();
    else if (action === 'btn:scorecard') { handlers.onScorecard(); setModal('performance'); if (desk) drawPerf(desk); }
    else if (action === 'prop:approve') handlers.onApprove();
    else if (action === 'prop:deny') handlers.onDeny();
    else if (action === 'pos:close') handlers.onClosePosition();
    else if (action === 'ticket:review') { proposalDismissed = false; if (desk) drawProposal(desk); }
    else if (action === 'pop:close:performance' || action === 'pop:close:journal') setModal(null);
    else if (action === 'pop:close:proposal') { proposalDismissed = true; if (desk) drawProposal(desk); }
    else if (action.startsWith('perf:reinstate:')) { handlers.onReinstate(action.slice('perf:reinstate:'.length)); if (desk) drawPerf(desk); }
    else if (action === 'jrnl:up') { journalPinned = false; journalPage = Math.max(0, journalPage - 1); drawJournal(); }
    else if (action === 'jrnl:down') {
      const pages = Math.max(1, Math.ceil(entries.length / PAGE));
      journalPage = Math.min(pages - 1, journalPage + 1);
      if (journalPage >= pages - 1) journalPinned = true;
      drawJournal();
    } else return false;
    return true;
  }

  // ---------- per-frame: pop-up bob + yaw, scenario-brain life ----------
  const _v = new THREE.Vector3();
  function update(dt, camera) {
    elapsed += dt;
    // scenario brain: state timers, spin-up, breathing pulse, block tint
    if (brain.mode === 'block') {
      brain.blockT -= dt;
      if (brain.blockT <= 0) { brain.mode = 'standby'; brain.failedStep = 0; drawBrainPlaque(); }
    } else if (brain.mode === 'done' || brain.mode === 'surge') {
      brain.holdT -= dt;
      if (brain.holdT <= 0) { brain.mode = 'standby'; brain.doneMask = 0; brain.resolution = null; drawBrainPlaque(); }
    }
    const targetSpin = brain.mode === 'thinking' ? 1.7 : brain.mode === 'block' ? 0.25 : 0.18;
    brain.spin += (targetSpin - brain.spin) * Math.min(1, dt * 2.5);
    sbGroup.rotation.y += dt * brain.spin;
    sbRings.rotation.y -= dt * (0.12 + brain.spin * 0.35);
    sbGroup.scale.setScalar(1.3 * (1 + Math.sin(elapsed * (brain.mode === 'thinking' ? 3.2 : 1.4)) * (brain.mode === 'thinking' ? 0.06 : 0.035)));
    sbHalo.lookAt(camera.position);
    const analysing = brain.mode === 'thinking' || brain.mode === 'surge';
    sbPing.visible = analysing;
    if (analysing) {
      sbPingState.t += dt;
      const stepT = 0.09;
      if (sbPingState.t >= stepT) { sbPingState.t = 0; sbPingState.k = (sbPingState.k + 1) % sbNodes.length; }
      const n = sbNodes[sbPingState.k];
      sbPing.position.set(n[0], n[1], n[2]);
      sbPing.scale.setScalar(1 + 0.8 * (1 - sbPingState.t / stepT));
    }
    const targetOp = brain.mode === 'thinking' ? 1.0 : brain.mode === 'standby' ? 0.85 : 0.95;
    sbPointsMat.opacity += (targetOp - sbPointsMat.opacity) * Math.min(1, dt * 3);
    sbLinesMat.opacity = sbPointsMat.opacity * 0.55;
    const rt = brain.mode === 'block' ? Math.max(0, brain.blockT / 1.6) : 0;
    sbPointsMat.color.setRGB(1, 1 - 0.6 * rt, 1 - 0.6 * rt);
    sbGlowMat.color.setRGB(0.21 + 0.79 * rt, 0.77 - 0.53 * rt, 1 - 0.66 * rt);
    if (brain.mode === 'thinking') drawBrainPlaque(); // step blink
    for (const P of [proposalP, positionP, perfP, journalP]) {
      if (!P.group.visible || !P.anchor) continue;
      P.group.position.y = P.anchor.y + Math.sin(elapsed * 0.85 + P.phase) * 0.13;
      _v.copy(camera.position).sub(P.group.position);
      const targetYaw = Math.atan2(_v.x, _v.z) * 0.92;
      let d = targetYaw - P.group.rotation.y;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      P.group.rotation.y += d * Math.min(1, dt * 4);
      if (P.backMat) P.backMat.opacity = (P === proposalP ? 0.38 : 0.28) + 0.08 * Math.sin(elapsed * 2.1 + P.phase);
    }
  }

  // ---------- aspect-adaptive dock layout ----------
  // The ticker tiles arc over the glass top and the board buttons
  // stand in a row on the front deck — the same in both aspects.
  // Landscape: flank panels in side columns, cam block on the rim.
  // Portrait (narrow) recomposes the rest: the mode dial goes
  // front-center, the flanks take the back corners beside the screen,
  // and the cam block stands on the front-right deck — so the chart
  // screen itself can fill >= 85% of the frame width (amendment 3).
  // The scenario brain sits on the plate's center hub in both aspects
  // (C-LO's word, 2026-10-28).
  function camLayout(port) {
    const yaw = port ? -0.3 : 0.85;
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    // portrait: front-right deck (it used to float at the screen's
    // top-right, ON the glass — C-LO's "remove those off the screen").
    // x 19.5, not 26: at deck depth the projection runs ~9.3 px per
    // world unit, and a 26 center threw the block's right corners to
    // px 445 — outside the 390 frame (probe-cam.mjs, 2026-10-29)
    const C = port ? [19.5, 19] : arcPos(34, 1.55);
    const cy = port ? 4.6 : 3.5, spread = port ? 1.55 : 1.62;
    camPanels.forEach((P, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const ox = (col === 0 ? -spread : spread), oy = row === 0 ? 0.88 : -0.88;
      stand(P, C[0] + rx * ox, C[1] + rz * ox, 1.8, (cy + oy) - 1.8, yaw, -0.06);
    });
  }
  function setBrainPos(x, z, plaqueYaw) {
    sbPos.x = x; sbPos.z = z;
    sbPed.position.set(x, 2.44, z);
    sbGlow.position.set(x, 3.12, z);
    sbGroup.position.set(x, sbPos.y, z);
    sbHalo.position.set(x, sbPos.y, z - 1.4);
    stand(sbPlaque, x, z + 4.6, 1.8, 2.3, plaqueYaw, -0.06);
  }
  function applyDockLayout() {
    const tilesArr = Object.values(tiles), btnArr = Object.values(boardBtns);
    if (!portrait) {
      tilesArr.forEach((P, i) => { P.group.scale.setScalar(1); const tp = tileArcPos(i); stand(P, tp.x, tp.z, 1.8, 33.2, tp.yaw, -0.06); });
      btnArr.forEach((P, i) => stand(P, BTN_POS[i][0], BTN_POS[i][1], 1.8, BTN_POS[i][2] - 1.8, BTN_POS[i][3], -0.06));
      stand(flankL, -COL_X, COL_Z, 1.8, 4.62 - 1.8, 0.16, -0.04);
      stand(flankR, COL_X, COL_Z, 1.8, 18.55 - 1.8, -0.16, -0.04);
      stand(dial, 23.4, 3.2, 1.8, 1.8, -0.62, -0.08);
      stand(gaugeL, -15.8, 22.6, 0, 0.15, 0, -0.95);
      stand(gaugeR, 15.8, 22.6, 0, 0.15, 0, -0.95);
      camLayout(false);
      setBrainPos(0, 0, 0);
    } else {
      tilesArr.forEach((P, i) => { P.group.scale.setScalar(1); const tp = tileArcPos(i); stand(P, tp.x, tp.z, 1.8, 33.2, tp.yaw, -0.06); });
      btnArr.forEach((P, i) => stand(P, BTN_POS[i][0], BTN_POS[i][1], 1.8, BTN_POS[i][2] - 1.8, BTN_POS[i][3], -0.06));
      stand(flankL, -27.5, -18, 1.8, 4.62 - 1.8, 0.5, -0.04);
      stand(flankR, 27.5, -18, 1.8, 18.55 - 1.8, -0.5, -0.04);
      stand(dial, 0, 6, 1.8, 6.9, 0, -0.06);
      stand(gaugeL, -15.2, 20.5, 0, 0.15, 0, -0.95);
      stand(gaugeR, 15.2, 20.5, 0, 0.15, 0, -0.95);
      camLayout(true);
      setBrainPos(0, 0, 0);
    }
  }

  // ---------- dock registry: projected boxes for framing + layout tests ----------
  const boxSets = {
    tiles: Object.values(tiles),
    buttonsL: [boardBtns.performance, boardBtns.journal],
    buttonsR: [boardBtns.rehearsal, boardBtns.scorecard],
    buttons: Object.values(boardBtns), cam: camPanels,
    plaques: Object.values(plaques), dial: [dial], readout: [readout],
    gauges: [gaugeL, gaugeR], flankL: [flankL], flankR: [flankR],
  };
  function panelCorners(P) {
    P.mesh.updateWorldMatrix(true, false);
    const hw = P.w / 2, hh = P.h / 2;
    return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([lx, ly]) => {
      const v = P.mesh.localToWorld(new THREE.Vector3(lx, ly, 0));
      return [v.x, v.y, v.z];
    });
  }
  function sbOrbPts() {
    const c = [sbPos.x, sbPos.y, sbPos.z], pts = [];
    for (const dx of [-5.3, 5.3]) pts.push([c[0] + dx, c[1], c[2]]);
    for (const dy of [-4.4, 4.4]) pts.push([c[0], c[1] + dy, c[2]]);
    for (const dz of [-5.3, 5.3]) pts.push([c[0], c[1], c[2] + dz]);
    return pts;
  }
  function boxes() {
    const out = {};
    for (const [name, set] of Object.entries(boxSets)) {
      const corners = [];
      for (const P of set) corners.push(...panelCorners(P));
      const c = [0, 0, 0];
      for (const p of corners) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }
      out[name] = { center: [c[0] / corners.length, c[1] / corners.length, c[2] / corners.length], corners };
    }
    out.brain = { center: [sbPos.x, (sbPos.y + 4.1) / 2, sbPos.z], corners: [...panelCorners(sbPlaque), ...sbOrbPts()] };
    return out;
  }
  function framePoints() {
    const pts = [];
    for (const [name, set] of Object.entries(boxSets)) {
      // portrait fit is driven by the core composition (screen + front
      // deck + arc); the back-corner flanks ride at the frame's edge,
      // and the cam block — now standing on the front-right deck, much
      // closer to the camera than the glass — must not drive the fit
      // either, or its nearness pulls the whole framing back and
      // shrinks the chart screen (mobile span fell 384px -> 312px)
      if (portrait && (name === 'flankL' || name === 'flankR' || name === 'cam')) continue;
      for (const P of set) pts.push(...panelCorners(P));
    }
    pts.push(...panelCorners(sbPlaque), ...sbOrbPts());
    return pts;
  }

  return {
    group: root, tiles, plaques, popups, flankL, flankR, gaugeL, gaugeR,
    bind(d, f, e) { desk = d; feed = f; entries = e; },
    notifyEntries() { entriesVersion++; },
    setScorecard(card) { lastScorecard = card; },
    watch(F, selected) { for (const m of SYMBOLS) drawTile(tiles[m.sym], m, F.series[m.sym], m.sym === selected); },
    chain(map) { for (const b of BOTS) drawPlaque(plaques[b.key], b, map[b.key]); },
    dial(D) { drawDial(D); },
    readout(D) { drawReadout(D); },
    flanks(F, selected, D) { drawFlankL(F, selected); if (D) drawFlankR(D); },
    gauges(D) { drawGauges(D); },
    brainEvent, brainTick,
    brainState() { return { mode: brain.mode, step: brain.step, tests: brain.tests, batches: brain.batches, paths: brain.paths, doneMask: brain.doneMask }; },
    boxes, framePoints,
    syncProposal(D) { drawProposal(D); },
    syncPosition(D, F) { drawPosition(D, F); },
    drawPerf, drawJournal,
    isOpen(name) {
      if (name === 'proposal') return proposalP.group.visible;
      if (name === 'position') return positionP.group.visible;
      return openModalName === name;
    },
    open(name) { if (name === 'performance' || name === 'journal') { setModal(name); if (name === 'performance' && desk) drawPerf(desk); if (name === 'journal') drawJournal(); } },
    close(name) { if (openModalName === name) setModal(null); },
    hitMeshes, actionFor, pointFor, dispatch,
    setAspect(a) {
      aspect = a;
      const port = a < 0.9, flipped = port !== portrait;
      if (flipped) { portrait = port; applyDockLayout(); }
      layoutPopups();
      return flipped;
    },
    update,
    debugState() {
      return {
        openModal: openModalName, proposalOpen: proposalP.group.visible,
        positionOpen: positionP.group.visible, journalPage,
        journalPages: Math.max(1, Math.ceil(entries.length / PAGE)), entries: entries.length,
      };
    },
  };
}

// ================= PAGE SHELL =================
// ============================================================ HOLO DESK — PAGE SHELL
// Wires the feed, desk, chart canvas, 3D scene and the HOLO BOARD
// together. There is no DOM dashboard anymore (C-LO, 2026-10-28):
// the plate fills the screen and every control is either part of the
// board in the scene or a holographic pop-up. DOM survives only as a
// WebGL-failure fallback line. All redraws are on event or cadence —
// nothing repaints per frame except the WebGL scene itself.

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- journal entries (single sink; the desk logs through here) ----------
const entries = [];
let board = null;
function log(kind, text) {
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, '0'), mm = String(t.getMinutes()).padStart(2, '0'), ss = String(t.getSeconds()).padStart(2, '0');
  entries.push({ time: `${hh}:${mm}:${ss}`, kind, text });
  if (entries.length > 240) entries.shift();
  if (board) board.notifyEntries();
}

// ---------- core objects ----------
const feed = createFeed();
const chartCanvas = document.createElement('canvas');
const chart = createChart(chartCanvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const f = $('glfail');
  if (f) f.style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const appEl = $('app');
function stageSize() { return [appEl.clientWidth || innerWidth, appEl.clientHeight || innerHeight]; }
{
  const [sw, sh] = stageSize();
  renderer.setSize(sw, sh);
}
appEl.appendChild(renderer.domElement);
const sceneH = createScene(THREE, OrbitControls, renderer, chartCanvas);
{
  const [sw, sh] = stageSize();
  sceneH.setViewport(sw, sh);
}

// ---------- board handlers (taps in the scene route here) ----------
const ui = {
  selected: 'AAPL', tf: '15m', chartDirty: true, lastDraw: 0,
  beam: { state: 'sweep', t: 0, pauseT: 0, blockT: 0 },
};
let desk = null;
const handlers = {
  onSelectSymbol: (sym) => selectSymbol(sym),
  onMode: (m) => { if (desk) { desk.setMode(m); store.set('holo.mode', desk.mode); } },
  onCap: (d) => { if (desk) { desk.setLeashCap(desk.leashCap + d); store.set('holo.leashCap', String(desk.leashCap)); board.dial(desk); } },
  onApprove: () => { if (desk) { desk.approve(); board.syncProposal(desk); board.syncPosition(desk, feed); } },
  onDeny: () => { if (desk) { desk.deny(); board.brainEvent('denied'); board.syncProposal(desk); } },
  onClosePosition: () => { if (desk) { desk.closePosition(); board.syncPosition(desk, feed); } },
  onRehearsal: () => { if (desk) { desk.runRehearsal(); board.readout(desk); } },
  onScorecard: () => { if (desk) desk.postScorecard(); },

};
board = createBoard(THREE, sceneH.scene, handlers, { SYMBOLS, BOTS, fmtPrice, fmtMoney, fmtSigned, patternName });
board.setAspect(stageSize()[0] / Math.max(1, stageSize()[1]));

desk = createDesk(feed, log, {
  mode: store.get('holo.mode') || 'approve',
  leashCap: parseInt(store.get('holo.leashCap') || '5', 10) || 5,
});
board.bind(desk, feed, entries);
desk.select(ui.selected);

// ---------- scanner beam controller ----------
// The beam visualises Scanner's real scan of the selected chart: it
// sweeps on cadence, and LOCKS only when the desk's Scanner actually
// raises a candidate on this symbol (desk 'candidate' event). A BLOCK
// downstream flashes the reticle red, then the rotation resumes.
function beamView() {
  if (!TF_INTRA[ui.tf]) return null;
  const b = ui.beam, win = chart.layout.win || 84;
  if (b.state === 'sweep') {
    const k = Math.min(1, b.t / 4.4);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    return { mode: 'sweep', pos: e * (win - 1) };
  }
  if (b.state === 'pause') return { mode: 'sweep', pos: win - 1 };
  if (b.state === 'lock') return { mode: 'lock' };
  if (b.state === 'block') return { mode: 'block', strength: Math.max(0, b.blockT / 1.3) };
  return null;
}
const TF_INTRA = { '1m': 1, '5m': 1, '15m': 1, '1h': 1 };
function beamUpdate(dt) {
  const b = ui.beam;
  if (b.state === 'sweep') { b.t += dt; if (b.t >= 4.4) { b.state = 'pause'; b.pauseT = 0.9; } }
  else if (b.state === 'pause') { b.pauseT -= dt; if (b.pauseT <= 0) { b.state = 'sweep'; b.t = 0; } }
  else if (b.state === 'block') { b.blockT -= dt; if (b.blockT <= 0) { b.state = 'sweep'; b.t = 0; } }
}

// ---------- desk events -> crew, beam, board ----------
desk.onEvent = (type, p) => {
  if (type === 'candidate') {
    sceneH.crew.burst('manus');
    board.brainEvent('candidate', p);
    if (p.sym === ui.selected && TF_INTRA[ui.tf]) ui.beam.state = 'lock';
    ui.chartDirty = true;
  } else if (type === 'gatefail') {
    board.brainEvent('gatefail', p);
    if (p.sym === ui.selected && ui.beam.state === 'lock') { ui.beam.state = 'block'; ui.beam.blockT = 1.3; }
    ui.chartDirty = true;
  } else if (type === 'proposal') {
    sceneH.crew.burst('claude');
    if (p.proposal.sym === ui.selected) { ui.beam.state = 'sweep'; ui.beam.t = 0; }
    board.syncProposal(desk);
    ui.chartDirty = true;
  } else if (type === 'filled') {
    sceneH.crew.burst('claude');
    board.brainEvent('filled', p);
    board.syncProposal(desk); board.syncPosition(desk, feed);
    ui.chartDirty = true;
  } else if (type === 'closed') {
    sceneH.crew.burst('claude'); sceneH.crew.burst('muse');
    board.syncProposal(desk); board.syncPosition(desk, feed); board.readout(desk);
    if (board.isOpen('performance')) board.drawPerf(desk);
    ui.chartDirty = true;
  } else if (type === 'bench') {
    if (board.isOpen('performance')) board.drawPerf(desk);
    board.readout(desk);
  } else if (type === 'scorecard') {
    board.setScorecard(p.card);
    if (board.isOpen('performance')) board.drawPerf(desk);
  } else if (type === 'rehearsal') {
    sceneH.crew.burst('muse');
    board.brainEvent('rehearsal', p);
    board.readout(desk);
    if (board.isOpen('performance')) board.drawPerf(desk);
  } else if (type === 'mode') {
    board.dial(desk);
  } else if (type === 'candle') {
    if (p.sym === ui.selected) { ui.chartDirty = true; sceneH.crew.burst('chatgpt'); }
  }
};

// ---------- selection + timeframes ----------
function selectSymbol(sym) {
  if (ui.selected === sym) return;
  ui.selected = sym;
  desk.select(sym);
  ui.beam.state = 'sweep'; ui.beam.t = 0;
  sceneH.crew.burst('chatgpt');
  board.watch(feed, ui.selected);
  ui.chartDirty = true;
}
function setTf(tf) {
  ui.tf = tf;
  ui.beam.state = 'sweep'; ui.beam.t = 0;
  sceneH.crew.burst('chatgpt');
  ui.chartDirty = true;
}

// ---------- chain state for the plaques ----------
function chainMap() {
  const map = {};
  for (const b of BOTS) map[b.key] = chipText(b.key);
  return map;
}
function chipText(key) {
  const c = desk.chain[key];
  if (c.state !== 'idle') {
    if (key === 'scanner' && desk._run) {
      const S = feed.series[desk._run.sym];
      return { state: c.state, text: `LOCKED: ${desk._run.sym} ${patternName(S.lastPattern)}` };
    }
    return { state: c.state, text: c.verdict };
  }
  const halted = desk.stoppedDate === new Date().toISOString().slice(0, 10);
  switch (key) {
    case 'scanner': return { state: 'idle', text: TF_INTRA[ui.tf] && ui.beam.state === 'sweep' ? 'BEAM SWEEP' : `SCANNING ${desk.scanIdx}/7` };
    case 'analysis': return { state: 'idle', text: 'WATCHING' };
    case 'strategy': return { state: 'idle', text: 'STANDBY' };
    case 'risk': return { state: halted ? 'fail' : 'idle', text: halted ? 'BRAKE ON — DAY HALTED' : 'BRAKES ARMED' };
    case 'execution': return { state: 'idle', text: desk.position ? `WATCHING STOP ${desk.position.stop.toFixed(2)}` : `MODE: ${desk.mode.toUpperCase()}` };
    case 'growth': return { state: 'idle', text: 'STATS LIVE' };
  }
  return { state: 'idle', text: '—' };
}
function syncCrewWork() {
  const run = desk._run;
  sceneH.crew.setWork('manus', !!(run && run.stage === 'analysis'));
  sceneH.crew.setWork('grok', !!(run && run.stage === 'strategy'));
  sceneH.crew.setWork('claude', !!(run && run.stage === 'risk'));
  sceneH.crew.setWork('muse', desk.chain.growth.state === 'pass');
}

// ---------- raycast taps: screen tabs + every board control ----------
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
    downAt = null;
    if (moved > 6) return;

    ndc.set(((e.clientX - cr.left) / cr.width) * 2 - 1, -((e.clientY - cr.top) / cr.height) * 2 + 1);

    // touches it. Deck panels nearer the camera (the portrait tile
    // row) otherwise steal taps aimed at the proposal card — a tap on
    // APPROVE switched the symbol to NVDA instead of filling the
    // ticket (caught 2026-10-28 after the screen enlargement shifted
    // the projection). A tap on the card's body is consumed, not
    // passed through to whatever sits behind it.
    const popMeshes = Object.values(board.popups)
      .filter((P) => { let n = P.group; while (n) { if (!n.visible) return false; n = n.parent; } return true; })
      .map((P) => P.mesh);
    if (popMeshes.length) {
      const popHits = ray.intersectObjects(popMeshes, false);
      if (popHits.length) {
        const action = board.actionFor(popHits[0].object, popHits[0].uv);
        if (action) board.dispatch(action);
        return;
      }
    }
    const hits = ray.intersectObjects([sceneH.screen, ...board.hitMeshes()], false);
    for (const hit of hits) {
      if (hit.object === sceneH.screen) {
        if (hit.uv) {
          const tf = tabAtUV(1 - hit.uv.x, hit.uv.y);
          if (tf) { setTf(tf); return; }
        }
        continue;
      }
      const action = board.actionFor(hit.object, hit.uv);
      if (action) { board.dispatch(action); return; }
    }
  });
}
function applySize() {
  const [w, h] = stageSize();
  renderer.setSize(w, h);
  const flipped = board.setAspect(w / Math.max(1, h));
  if (flipped) sceneH.setFitPoints([...sceneH.screenAnchors(), ...board.framePoints()]);
  sceneH.setViewport(w, h);
}
addEventListener('resize', applySize);
// Mobile browsers settle their viewport late (URL bar / toolbars): re-run
// the fit shortly after load so the desk can never be stranded in a
// stale, too-far framing — setViewport re-derives the distance every
// time (and preserves the user's angle once they have orbited).
setTimeout(applySize, 350);
setTimeout(applySize, 1500);
setTimeout(applySize, 3000);
addEventListener('orientationchange', () => setTimeout(applySize, 250));
document.addEventListener?.('visibilitychange', () => { if (!document.hidden) applySize(); });
// A tap is not an orbit. Only a real drag (pointer travel past 24px)
// or a wheel/pinch zoom hands the framing to the user; until then the
// desk re-frames itself on every viewport settle, so a phone viewer
// can never strand it small, high and far away the way C-LO's
// 2026-10-28 screenshot showed.
{
  let pDown = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => { pDown = [e.clientX, e.clientY]; });
  el.addEventListener('pointermove', (e) => {
    if (!pDown) return;
    if (Math.hypot(e.clientX - pDown[0], e.clientY - pDown[1]) > 24) { sceneH.markUserMoved(); pDown = null; }
  });
  el.addEventListener('pointerup', () => { pDown = null; });
  el.addEventListener('pointercancel', () => { pDown = null; });
  el.addEventListener('wheel', () => sceneH.markUserMoved(), { passive: true });
}

// ---------- helpers the tests drive ----------
function projectToClient(v) {
  const p = v.clone().project(sceneH.camera);
  const r = renderer.domElement.getBoundingClientRect();
  return {
    x: r.left + ((p.x + 1) / 2) * r.width,
    y: r.top + ((1 - p.y) / 2) * r.height,
    inFrame: p.z < 1 && Math.abs(p.x) <= 1.02 && Math.abs(p.y) <= 1.02,
  };
}

// ---------- main loop ----------
let last = performance.now(), acc = { watch: 0, chain: 0, ticket: 0, perf: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  feed.update(dt);
  desk.update(dt);
  beamUpdate(dt);
  sceneH.update(dt);
  board.update(dt, sceneH.camera);
  // chart redraw: on dirty at ~4Hz, and ~11Hz while the beam is live
  const beamLive = TF_INTRA[ui.tf] && ui.beam.state !== 'lock';
  if ((ui.chartDirty && now - ui.lastDraw > 240) || (beamLive && now - ui.lastDraw > 90) || (ui.beam.state === 'lock' && ui.chartDirty)) {
    chart.draw({ S: feed.series[ui.selected], tf: ui.tf, desk, beam: beamView(), now });
    sceneH.chartTex.needsUpdate = true;
    ui.lastDraw = now; ui.chartDirty = false;
  }
  acc.watch += dt; acc.chain += dt; acc.ticket += dt; acc.perf += dt;
  if (acc.watch > 0.5) { acc.watch = 0; board.watch(feed, ui.selected); board.flanks(feed, ui.selected, desk); }
  if (acc.chain > 0.25) { acc.chain = 0; board.chain(chainMap()); board.dial(desk); board.brainTick(desk); syncCrewWork(); }
  if (acc.ticket > 0.4) {
    acc.ticket = 0;
    board.syncProposal(desk); board.syncPosition(desk, feed);
    if (board.isOpen('journal')) board.drawJournal();
  }
  if (acc.perf > 1.5) {
    acc.perf = 0;
    board.readout(desk);
    board.gauges(desk);
    if (board.isOpen('performance')) board.drawPerf(desk);
  }
  renderer.render(sceneH.scene, sceneH.camera);
}
// growth's slow cycle: a rehearsal replay every ~15 min when the desk is free
setInterval(() => { if (!desk.position && !desk.proposal && !desk._run) desk.runRehearsal(); }, 900000);

board.watch(feed, ui.selected);
board.chain(chainMap());
board.dial(desk);
board.readout(desk);
board.flanks(feed, ui.selected, desk);
board.gauges(desk);
// frame the whole composition (screen + docks + flanks + etched strip)
// from its real anchors, so the plate fills the view at any aspect
sceneH.setFitPoints([...sceneH.screenAnchors(), ...board.framePoints()]);
{
  const [sw, sh] = stageSize();
  sceneH.setViewport(sw, sh);
}
chart.draw({ S: feed.series[ui.selected], tf: ui.tf, desk, beam: beamView(), now: performance.now() });
sceneH.chartTex.needsUpdate = true;
requestAnimationFrame(frame);

window.__holo = {
  feed, desk, scene: sceneH, chart, ui, board, entries,
  selectSymbol, setTf,
  projectToClient,
  project: (arr) => projectToClient(new THREE.Vector3(arr[0], arr[1], arr[2])),
  boxes: () => ({ screen: sceneH.screenBox(), ...board.boxes() }),
  pointOf: (a) => { const v = board.pointFor(a); return v ? projectToClient(v) : null; },
  tapAction: (a) => board.dispatch(a),
  testPoints() {
    const bx = window.__holo.boxes();
    const C = (name) => projectToClient(new THREE.Vector3(...bx[name].center));
    return {
      plate: projectToClient(new THREE.Vector3(0, 1.8, 18)),
      screen: C('screen'), plaque: C('plaques'), tile: C('tiles'),
      readout: C('readout'), dial: C('dial'),
      flankL: C('flankL'), flankR: C('flankR'), cam: C('cam'),
    };
  },
};

</script>
</body>
</html>
