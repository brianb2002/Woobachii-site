<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// ================= SIM FEED (multi-symbol, feed-only indicators) =================
// ============================================================ HOLO DESK FEED
// Multi-symbol SIM feed, adapted from the Clockwork Stage 4 Data Feed
// (the feed is the ONLY source of prices and indicators — that rule
// carries over). Seven symbols, each with an independent seeded SIM
// series that runs whether or not it is selected: 1-minute candles
// (12 ticks ≈ 10.2 s SIM clock) plus a daily series for the 1D/1W/1M
// tabs. Indicators: EMA 9/21/50, RSI 14, ATR 14, fractal swing high/low,
// pattern classification (FVG / BOS / liquidity sweep) — computed here
// and nowhere else, exactly as the desk's locked rules require.

const SYMBOLS = [
  { sym: 'AAPL', name: 'Apple Inc',        anchor: 178.32,  candleVol: 0.0080, baseVol: 118000, seed: 101 },
  { sym: 'TSLA', name: 'Tesla Inc',        anchor: 248.50,  candleVol: 0.0130, baseVol: 265000, seed: 202 },
  { sym: 'NVDA', name: 'NVIDIA Corp',      anchor: 131.88,  candleVol: 0.0120, baseVol: 310000, seed: 303 },
  { sym: 'BTC',  name: 'Bitcoin USD',      anchor: 67412.0, candleVol: 0.0100, baseVol: 840,    seed: 404 },
  { sym: 'ETH',  name: 'Ethereum USD',     anchor: 3521.40, candleVol: 0.0120, baseVol: 12500,  seed: 505 },
  { sym: 'SPY',  name: 'SPDR S&P 500 ETF', anchor: 547.62,  candleVol: 0.0045, baseVol: 148000, seed: 606 },
  { sym: 'QQQ',  name: 'Invesco QQQ',      anchor: 460.15,  candleVol: 0.0060, baseVol: 112000, seed: 707 },
];

const TICKS_PER_CANDLE = 12;
const TICK_S = 0.85;                 // seconds per tick (SIM clock, as Stage 4)
const SEED_CANDLES = 3000;           // intraday warm-up per symbol
const SEED_DAYS = 320;               // daily warm-up per symbol
const DAY_CANDLES = 390;             // 1m candles per SIM trading day

function emaStep(prev, v, n) {
  const k = 2 / (n + 1);
  return prev === null ? v : v * k + prev * (1 - k);
}

function makeSeries(meta) {
  let seed = meta.seed * 7919 + 13;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const S = {
    meta, rnd,
    price: meta.anchor, prevTick: meta.anchor, anchor: meta.anchor,
    candles: [], live: null, candleCount: 0,
    e9: null, e21: null, e50: null, ema9: [], ema21: [], ema50: [],
    rsi: 50, atr: meta.anchor * 0.006,
    _g: 0, _l: 0, _tr: 0, _indN: 0, _indSeed: false,
    swingHigh: null, swingLow: null,
    lastPattern: null, patternHistory: [],
    setups: { gaps: [], pullback: null, events: [] },   // SUPERBASE playbook state machines (P-03 gaps, P-02 pullback)
    sessionVolume: 0,
    prevDayClose: meta.anchor,
    day: { open: meta.anchor, high: meta.anchor, low: meta.anchor },
    daily: { candles: [], e9: null, e21: null, e50: null, ema9: [], ema21: [], ema50: [], live: null },
    tickT: 0, tickIn: 0, _volAcc: 0,
  };
  return S;
}

// ---- indicators (feed-only) ----
function indicatorsOnClose(S, c, prevClose) {
  S.e9 = emaStep(S.e9, c.close, 9); S.ema9.push(S.e9);
  S.e21 = emaStep(S.e21, c.close, 21); S.ema21.push(S.e21);
  S.e50 = emaStep(S.e50, c.close, 50); S.ema50.push(S.e50);
  if (prevClose !== null && prevClose !== undefined) {
    const d = c.close - prevClose;
    const g = Math.max(d, 0), l = Math.max(-d, 0);
    const tr = Math.max(c.high - c.low, Math.abs(c.high - prevClose), Math.abs(c.low - prevClose));
    if (!S._indSeed) {
      S._g += g; S._l += l; S._tr += tr; S._indN++;
      if (S._indN >= 14) { S._g /= 14; S._l /= 14; S._tr /= 14; S._indSeed = true; }
    } else {
      S._g = (S._g * 13 + g) / 14; S._l = (S._l * 13 + l) / 14; S._tr = (S._tr * 13 + tr) / 14;
    }
    if (S._indSeed) {
      S.rsi = S._l === 0 ? 100 : 100 - 100 / (1 + S._g / S._l);
      S.atr = S._tr;
    }
  }
  c.rsi = S.rsi; c.atr = S.atr;
  // fractal swings: candle len-3 is confirmed once len-1 exists
  const cs = S.candles, i = cs.length - 3;
  if (i >= 2) {
    const m = cs[i];
    if (m.high > cs[i - 1].high && m.high > cs[i - 2].high && m.high >= cs[i + 1].high && m.high >= cs[i + 2].high) S.swingHigh = m.high;
    if (m.low < cs[i - 1].low && m.low < cs[i - 2].low && m.low <= cs[i + 1].low && m.low <= cs[i + 2].low) S.swingLow = m.low;
  }
}

// Pattern classification stays HERE (Data Feed is the only classifier).
// Same detection as Stage 4; the return carries the price geometry.
function detectPattern(S) {
  const cs = S.candles;
  if (cs.length < 12) return null;
  const c = cs[cs.length - 1], c2 = cs[cs.length - 3];
  if (c2 && c.low > c2.high && c.close > c.open) return { family: 'FVG', dir: 'up', gapLo: c2.high, gapHi: c.low };
  if (c2 && c.high < c2.low && c.close < c.open) return { family: 'FVG', dir: 'down', gapLo: c.high, gapHi: c2.low };
  let hi = -Infinity, lo = Infinity;
  for (let i = cs.length - 11; i < cs.length - 1; i++) { hi = Math.max(hi, cs[i].high); lo = Math.min(lo, cs[i].low); }
  if (c.high > hi && c.close < hi) return { family: 'LS', dir: 'down', level: hi, wick: c.high, extreme: 'high' };
  if (c.low < lo && c.close > lo) return { family: 'LS', dir: 'up', level: lo, wick: c.low, extreme: 'low' };
  if (c.close > hi) return { family: 'BOS', dir: 'up', level: hi };
  if (c.close < lo) return { family: 'BOS', dir: 'down', level: lo };
  return null;
}

function pushCandle(S, c, live) {
  const prev = S.candles.length ? S.candles[S.candles.length - 1].close : null;
  S.candles.push(c);
  S.candleCount++;
  S.sessionVolume += c.v;
  indicatorsOnClose(S, c, prev);
  // SIM day bookkeeping (390 1m candles = one trading day)
  if ((S.candleCount - 1) % DAY_CANDLES === 0) {
    if (prev !== null) S.prevDayClose = prev;
    S.day = { open: c.open, high: c.high, low: c.low };
  } else {
    S.day.high = Math.max(S.day.high, c.high);
    S.day.low = Math.min(S.day.low, c.low);
  }
  // SUPERBASE setup state machines run on the just-closed candle BEFORE
  // any new formation is registered, so a gap can never trigger itself.
  S.setups.events = [];
  updateGapLifecycle(S);
  updatePullbackSetup(S);
  const det = detectPattern(S);
  if (det) {
    S.lastPattern = det.family;
    S.patternHistory.push({ ...det, n: S.candleCount });
    if (S.patternHistory.length > 12) S.patternHistory.shift();
    if (det.family === 'FVG' && det.dir === 'up') formGap(S, det);
  }
  if (live && S._onCandle) S._onCandle(S.meta.sym, c, det);
}

function newLive(S) {
  S.live = { open: S.price, high: S.price, low: S.price, close: S.price, v: 0 };
  S._volAcc = 0;
}

function tick(S) {
  const p0 = S.price;
  // mildly mean-reverting walk around a slowly wandering anchor (SIM tape
  // design, as Stage 4: reversion keeps EMA crosses recurring)
  let p = p0 + (S.rnd() - 0.5) * S.meta.candleVol * p0 + (S.anchor - p0) * 0.004;
  p = Math.max(p, S.meta.anchor * 0.05);
  S.prevTick = p0; S.price = p;
  const lc = S.live;
  lc.high = Math.max(lc.high, p); lc.low = Math.min(lc.low, p); lc.close = p;
  S._volAcc += (S.meta.baseVol / TICKS_PER_CANDLE) * (0.45 + S.rnd() * 1.1);
  // daily series' forming candle tracks the intraday day
  const dl = S.daily.live;
  if (dl) { dl.high = Math.max(dl.high, p); dl.low = Math.min(dl.low, p); dl.close = p; }
  S.tickIn++;
  if (S.tickIn >= TICKS_PER_CANDLE) {
    S.tickIn = 0;
    S.anchor *= 1 + (S.rnd() - 0.5) * 0.0012;
    const done = { ...lc, v: Math.round(S._volAcc) };
    newLive(S);
    pushCandle(S, done, true);
  }
}

function seedSeries(S) {
  newLive(S);
  for (let i = 0; i < SEED_CANDLES; i++) {
    // run one candle silently (no live events during warm-up)
    for (let t = 0; t < TICKS_PER_CANDLE; t++) {
      const p0 = S.price;
      let p = p0 + (S.rnd() - 0.5) * S.meta.candleVol * p0 + (S.anchor - p0) * 0.004;
      p = Math.max(p, S.meta.anchor * 0.05);
      S.price = p;
      S.live.high = Math.max(S.live.high, p); S.live.low = Math.min(S.live.low, p); S.live.close = p;
      S._volAcc += (S.meta.baseVol / TICKS_PER_CANDLE) * (0.45 + S.rnd() * 1.1);
    }
    S.anchor *= 1 + (S.rnd() - 0.5) * 0.0012;
    const done = { ...S.live, v: Math.round(S._volAcc) };
    newLive(S);
    pushCandle(S, done, false);
  }
  // daily series: walk backwards from today's open so the last closed
  // daily candle ends where the current SIM day begins
  const D = S.daily;
  let cur = S.day.open;
  const back = [];
  for (let i = 0; i < SEED_DAYS; i++) {
    const close = cur;
    const open = close * (1 + (S.rnd() - 0.48) * 0.02);
    const high = Math.max(open, close) * (1 + S.rnd() * 0.008);
    const low = Math.min(open, close) * (1 - S.rnd() * 0.008);
    back.push({ open, high, low, close, v: Math.round(S.meta.baseVol * 390 * (0.6 + S.rnd() * 0.8)) });
    cur = open * (1 + (S.rnd() - 0.5) * 0.03);
  }
  back.reverse();
  for (const c of back) {
    D.candles.push(c);
    D.e9 = emaStep(D.e9, c.close, 9); D.ema9.push(D.e9);
    D.e21 = emaStep(D.e21, c.close, 21); D.ema21.push(D.e21);
    D.e50 = emaStep(D.e50, c.close, 50); D.ema50.push(D.e50);
  }
  D.live = { open: S.day.open, high: Math.max(S.day.high, S.price), low: Math.min(S.day.low, S.price), close: S.price, v: 0 };
}

// A frozen series for REHEARSAL mode: the desk steps a fixed candle
// day through the same indicator/pattern machinery (date hidden from
// the chain — candles carry no timestamps, only order).
function createFrozenSeries(anchor) {
  const meta = { sym: 'REPLAY', name: 'Rehearsal Day', anchor, candleVol: 0.008, baseVol: 1000, seed: 1 };
  const S = makeSeries(meta);
  S.price = anchor;
  newLive(S);
  return {
    series: S,
    close(c) {
      const prev = S.candles.length ? S.candles[S.candles.length - 1] : null;
      S.candles.push(c); S.candleCount++;
      indicatorsOnClose(S, c, prev ? prev.close : null);
      const det = detectPattern(S);
      if (det) { S.lastPattern = det.family; S.patternHistory.push({ ...det, n: S.candleCount }); }
      S.price = c.close;
      return det;
    },
  };
}

// Group a candle array by factor (for the timeframe tabs). Each output
// candle carries n0 = index of its first source candle (pattern mapping).
function resampleCandles(candles, factor) {
  if (factor <= 1) return candles.map((c, i) => ({ ...c, n0: i }));
  const out = [];
  for (let i = 0; i + factor <= candles.length; i += factor) {
    let h = -Infinity, l = Infinity, v = 0;
    for (let j = i; j < i + factor; j++) {
      h = Math.max(h, candles[j].high); l = Math.min(l, candles[j].low); v += candles[j].v;
    }
    out.push({ open: candles[i].open, high: h, low: l, close: candles[i + factor - 1].close, v, n0: i });
  }
  return out;
}

function createFeed() {
  const series = {};
  for (const meta of SYMBOLS) {
    const S = makeSeries(meta);
    seedSeries(S);
    series[meta.sym] = S;
  }
  const feed = {
    series,
    onCandleClose: null, // (sym, candle, patternEvent|null) — live closes only
    update(dt) {
      for (const meta of SYMBOLS) {
        const S = series[meta.sym];
        S._onCandle = feed.onCandleClose;
        S.tickT += dt;
        while (S.tickT >= TICK_S) { S.tickT -= TICK_S; tick(S); }
      }
    },
  };
  return feed;
}

// ============================================================ SUPERBASE
// Analyzer pack v1 + playbook classifier (knowledge/ANALYZERS.md,
// knowledge/PLAYBOOKS.md). Everything here DERIVES from feed-owned
// candles and indicators — the feed remains the only price/indicator
// computer. Analyzers run on closed candles only; insufficient history
// returns an explicit INSUFFICIENT_DATA state, never a guessed value.
// Candidates bind their pattern event's candle, geometry and age —
// they never borrow the (possibly stale) S.lastPattern.

const ANALYZER_VERSION = 'A-1.0';

const PLAYBOOKS = {
  'P-01': { id: 'P-01', name: 'EMA-CROSS TREND ENTRY', version: '1.0', family: 'EMA', eligibleRegimes: ['TREND_UP', 'TRANSITION'], trend: true, maxPatternAge: null },
  'P-02': { id: 'P-02', name: 'TREND PULLBACK TO EMA 21', version: '1.0', family: 'EMA', eligibleRegimes: ['TREND_UP'], trend: true, maxPatternAge: 3 },
  'P-03': { id: 'P-03', name: 'FAIR VALUE GAP CONTINUATION', version: '1.0', family: 'FVG', eligibleRegimes: ['TREND_UP', 'TRANSITION'], trend: true, maxPatternAge: 12 },
  'P-04': { id: 'P-04', name: 'BREAK OF STRUCTURE BREAKOUT', version: '1.0', family: 'BOS', eligibleRegimes: ['TREND_UP', 'TRANSITION', 'RANGE'], trend: true, maxPatternAge: 0 },
  'P-05': { id: 'P-05', name: 'LIQUIDITY SWEEP REVERSAL', version: '1.0', family: 'LS', eligibleRegimes: ['RANGE', 'TRANSITION', 'TREND_DOWN'], trend: false, maxPatternAge: 0 },
  'P-09': { id: 'P-09', name: 'RS LEADER CONTINUATION', version: '1.0', family: 'RS', eligibleRegimes: ['TREND_UP', 'TRANSITION'], trend: true, maxPatternAge: 0 },
};
const PLAYBOOK_ORDER = ['P-01', 'P-02', 'P-03', 'P-04', 'P-05', 'P-09'];

const medianOf = (arr) => {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

// ---------- P-03 active-gap lifecycle (first-class state machine) ----------
function formGap(S, det) {
  const c = S.candles[S.candles.length - 1];
  const width = det.gapHi - det.gapLo;
  if (!(S.atr > 0) || width < 0.15 * S.atr) return;          // too small to be a playbook gap
  if (!(c.close > S.e21 && S.e9 > S.e21)) return;            // formation must sit in EMA posture
  S.setups.gaps.push({
    id: (S.setups.nextGapId = (S.setups.nextGapId || 0) + 1),
    formationCandle: S.candleCount, gapLo: det.gapLo, gapHi: det.gapHi,
    atrAtFormation: S.atr, formationStrength: (c.high - c.low) / S.atr,
    status: 'ACTIVE', resolvedCandle: null,
  });
}
function updateGapLifecycle(S) {
  const i = S.candleCount, cs = S.candles, c = cs[cs.length - 1];
  if (!c) return;
  for (const g of S.setups.gaps) {
    if (g.status !== 'ACTIVE') continue;
    const age = i - g.formationCandle;
    if (age <= 0) continue;
    if (age > 12) { g.status = 'EXPIRED'; g.resolvedCandle = i; continue; }
    if (c.close < g.gapLo) { g.status = 'INVALIDATED'; g.resolvedCandle = i; continue; }
    if (c.low < g.gapLo - 0.25 * S.atr) { g.status = 'FILLED'; g.resolvedCandle = i; continue; }
    if (c.low <= g.gapHi + 0.10 * S.atr && c.close > g.gapHi && S.rsi < 70) {
      g.status = 'TRIGGERED'; g.resolvedCandle = i;
      const width = g.gapHi - g.gapLo;
      S.setups.events.push({
        playbookId: 'P-03', patternAge: age,
        geometry: {
          gapId: g.id, gapLo: g.gapLo, gapHi: g.gapHi, formationCandle: g.formationCandle,
          gapWidthATR: S.atr > 0 ? width / S.atr : null, formationStrength: g.formationStrength,
          mitigationDepthPct: width > 0 ? Math.round(Math.min(100, Math.max(0, (g.gapHi - Math.max(c.low, g.gapLo)) / width)) * 100) : 0,
        },
      });
    }
  }
  // resolved gaps are kept 40 candles for the record, then pruned
  S.setups.gaps = S.setups.gaps.filter((g) => g.status === 'ACTIVE' || i - (g.resolvedCandle || g.formationCandle) <= 40);
}

// ---------- P-02 pullback setup state machine ----------
function updatePullbackSetup(S) {
  const cs = S.candles, idx = cs.length - 1, c = cs[idx], i = S.candleCount;
  if (!c || idx < 5) return;
  const ps = S.setups.pullback;
  if (ps) {
    const age = i - ps.setupCandle;
    if (age > 3) S.setups.pullback = null;
    else if (c.close < S.ema21[idx] || c.close < ps.low) S.setups.pullback = null;   // structural invalidation
    else if (c.close > ps.high && c.close > S.ema9[idx] && S.rsi < 68) {
      S.setups.pullback = null;
      S.setups.events.push({
        playbookId: 'P-02', patternAge: age,
        geometry: { setupCandle: ps.setupCandle, setupHigh: ps.high, setupLow: ps.low, pullbackDepthATR: ps.depthATR, ema21Slope5ATR: ps.slopeATR },
      });
    }
  }
  if (!S.setups.pullback) {
    const D = S.daily, dn = D.candles.length;
    const dailyUp = dn >= 50 && D.candles[dn - 1].close > D.ema21[dn - 1] && D.ema21[dn - 1] > D.ema50[dn - 1];
    if (dailyUp && S.ema21[idx] > S.ema50[idx] && S.atr > 0) {
      const slope = S.ema21[idx] - S.ema21[idx - 5];
      if (slope >= 0.25 * S.atr) {
        const e21 = S.ema21[idx];
        const touched = c.low <= e21 + 0.25 * S.atr && c.high >= e21 - 0.25 * S.atr;
        if (touched && c.close > e21 && c.rsi >= 40 && c.rsi <= 65) {
          S.setups.pullback = { setupCandle: i, high: c.high, low: c.low, depthATR: (e21 - c.low) / S.atr, slopeATR: slope / S.atr };
        }
      }
    }
  }
}

// ---------- A-01 multi-timeframe alignment ----------
function dailyStateOf(S) {
  const D = S.daily, n = D.candles.length;
  if (n < 50) return 'INSUFFICIENT_DATA';
  const c = D.candles[n - 1].close, e21 = D.ema21[n - 1], e50 = D.ema50[n - 1];
  const rising = n >= 6 && D.ema21[n - 1] > D.ema21[n - 6];
  const falling = n >= 6 && D.ema21[n - 1] < D.ema21[n - 6];
  if ((c > e21 && e21 > e50) || (c > e50 && rising)) return 'DAILY_UP';
  if ((c < e21 && e21 < e50) || (c < e50 && falling)) return 'DAILY_DOWN';
  return 'DAILY_MIXED';
}
function intradayStateOf(S) {
  const i = S.candles.length - 1;
  if (i < 50) return 'INSUFFICIENT_DATA';
  const c = S.candles[i].close;
  if (c > S.ema21[i] && S.ema9[i] > S.ema21[i]) return 'INTRA_UP';
  if (c < S.ema21[i] && S.ema9[i] < S.ema21[i]) return 'INTRA_DOWN';
  return 'INTRA_MIXED';
}

// ---------- A-05 volatility percentile ----------
function atrPercentileOf(S) {
  const i = S.candles.length - 1;
  const prior = [];
  for (let k = Math.max(0, i - 250); k < i; k++) if (typeof S.candles[k].atr === 'number') prior.push(S.candles[k].atr);
  if (prior.length < 20 || !(S.atr > 0)) return null;
  return (prior.filter((a) => a < S.atr).length / prior.length) * 100;
}

// ---------- A-02 regime classifier (evaluated in spec order) ----------
function regimeOf(S, pctile) {
  const cs = S.candles, i = cs.length - 1;
  const base = { trendSeparation: null, emaSlope10: null, efficiency20: null, emaCrossCount30: null, atrPercentile: pctile };
  if (i < 35 || !(S.atr > 0)) return { label: 'INSUFFICIENT_DATA', ...base };
  const trendSeparation = Math.abs(S.ema21[i] - S.ema50[i]) / S.atr;
  const emaSlope10 = (S.ema21[i] - S.ema21[i - 10]) / S.atr;
  let path = 0;
  for (let k = i - 19; k <= i; k++) path += Math.abs(cs[k].close - cs[k - 1].close);
  const efficiency20 = path > 0 ? Math.abs(cs[i].close - cs[i - 20].close) / path : 0;
  let emaCrossCount30 = 0;
  for (let k = i - 29; k <= i; k++) {
    const a = cs[k - 1].close - S.ema21[k - 1], b = cs[k].close - S.ema21[k];
    if ((a < 0 && b >= 0) || (a > 0 && b <= 0)) emaCrossCount30++;
  }
  const m = { trendSeparation, emaSlope10, efficiency20, emaCrossCount30, atrPercentile: pctile };
  let label;
  if (pctile !== null && pctile >= 75 && (efficiency20 < 0.30 || emaCrossCount30 >= 4)) label = 'HIGH_VOL_CHOP';
  else if (S.ema21[i] > S.ema50[i] && trendSeparation >= 0.50 && emaSlope10 >= 0.15 && efficiency20 >= 0.35) label = 'TREND_UP';
  else if (S.ema21[i] < S.ema50[i] && trendSeparation >= 0.50 && emaSlope10 <= -0.15 && efficiency20 >= 0.35) label = 'TREND_DOWN';
  else if (trendSeparation < 0.35 && Math.abs(emaSlope10) < 0.10 && efficiency20 < 0.30 && emaCrossCount30 >= 3) label = 'RANGE';
  else label = 'TRANSITION';
  return { label, ...m };
}

// ---------- A-03 relative strength across the watchlist ----------
function rsTable(feed) {
  const out = {};
  const rows = [];
  for (const sym of Object.keys(feed.series)) {
    const S = feed.series[sym], i = S.candles.length - 1;
    if (i < 60) continue;
    const roc = (k) => S.candles[i].close / S.candles[i - k].close - 1;
    const D = S.daily, dn = D.candles.length;
    rows.push({
      sym, roc20: roc(20), roc60: roc(60),
      roc390: S.day && S.day.open > 0 ? S.candles[i].close / S.day.open - 1 : null,
      roc20d: dn >= 21 ? D.candles[dn - 1].close / D.candles[dn - 21].close - 1 : null,
    });
  }
  const spy = rows.find((r) => r.sym === 'SPY');
  const rankOf = (key) => {
    const sorted = rows.filter((r) => r[key] !== null).sort((a, b) => b[key] - a[key]);
    const m = {};
    sorted.forEach((r, ix) => { m[r.sym] = ix + 1; });
    return { m, sorted };
  };
  const r20 = rankOf('roc20'), r60 = rankOf('roc60'), r390 = rankOf('roc390');
  for (const r of rows) {
    const vsSpy60 = spy ? r.roc60 - spy.roc60 : null;
    const vsSpy20 = spy ? r.roc20 - spy.roc20 : null;
    const rank60 = r60.m[r.sym] ?? null;
    out[r.sym] = {
      roc20: r.roc20, roc60: r.roc60, roc390: r.roc390, roc20d: r.roc20d,
      vsSpy20, vsSpy60, rank20: r20.m[r.sym] ?? null, rank60, rank390: r390.m[r.sym] ?? null,
      leader: rank60 !== null && rank60 <= 2 && r.roc60 > 0 && vsSpy60 !== null && vsSpy60 > 0,
      laggard: rank60 !== null && rank60 >= rows.length - 1 && vsSpy60 !== null && vsSpy60 < 0,
      leadOverThird60: r60.sorted.length >= 3 && r60.sorted[0] ? r60.sorted[0].roc60 - r60.sorted[2].roc60 : null,
      spyRoc20: spy ? spy.roc20 : null,
    };
  }
  return out;
}

// ---------- A-08 bear-objection generators ----------
function regimeEligible(pbId, snap) {
  const pb = PLAYBOOKS[pbId];
  if (!pb) return true;
  if (pbId === 'P-05') return snap.regime.label === 'RANGE' || snap.mtf.dailyState !== 'DAILY_DOWN';
  return pb.eligibleRegimes.includes(snap.regime.label);
}
function generateObjections(S, snap, ctx) {
  const out = [];
  const pb = PLAYBOOKS[ctx.playbookId];
  const push = (code, force, fact, text) => out.push({ code, force, fact, text });
  if (snap.mtf.alignment === 'AGAINST_LONG')
    push('AGAINST_DAILY_TREND', pb && pb.trend ? 'EXCLUSION' : 'CONTEXT', snap.mtf.dailyState,
      'Price is below the daily trend structure; this long fights the higher-timeframe direction.');
  if (pb && snap.regime.label !== 'INSUFFICIENT_DATA' && !regimeEligible(pb.id, snap))
    push('REGIME_MISMATCH', 'EXCLUSION', snap.regime.label,
      `Current regime is ${snap.regime.label}; this playbook is designed for ${pb.eligibleRegimes.join(' / ')}.`);
  if (snap.relativeVolume.rvol20 !== null && snap.relativeVolume.rvol20 < 0.80)
    push('LOW_RVOL', 'CONTEXT', snap.relativeVolume.rvol20,
      `Signal-candle RVOL is ${snap.relativeVolume.rvol20.toFixed(2)}, below the symbol's recent median.`);
  if (snap.extension.aboveEMA21ATR !== null && snap.extension.aboveEMA21ATR >= 2.00)
    push('EXTENDED_FROM_EMA', ctx.playbookId === 'P-02' ? 'EXCLUSION' : 'CONTEXT', snap.extension.aboveEMA21ATR,
      `Entry is ${snap.extension.aboveEMA21ATR.toFixed(2)} ATR above EMA 21; normal pullback risk is elevated.`);
  if (snap.liquidity.distanceToSwingHighATR !== null && snap.liquidity.distanceToSwingHighATR >= 0 && snap.liquidity.distanceToSwingHighATR < 0.75)
    push('INTO_SWING_LIQUIDITY', 'CONTEXT', snap.liquidity.distanceToSwingHighATR,
      `Entry sits only ${snap.liquidity.distanceToSwingHighATR.toFixed(2)} ATR below the confirmed swing high at ${snap.liquidity.swingHigh.toFixed(2)}.`);
  if (snap.rsi >= 70)
    push('RSI_HEAT', 'BLOCK', snap.rsi, `RSI is ${snap.rsi.toFixed(0)}, at or beyond the desk's overbought gate of 70.`);
  else if (snap.rsi >= 60)
    push('RSI_HEAT', 'CONTEXT', snap.rsi, `RSI is ${snap.rsi.toFixed(0)}, leaving limited headroom before the desk's overbought gate.`);
  const hist = S.patternHistory, lastEv = hist.length ? hist[hist.length - 1] : null;
  if (lastEv && lastEv.family === 'LS' && S.candleCount - lastEv.n <= 3 && ctx.playbookId !== 'P-05')
    push('SWEEP_REVERSAL_CONTEXT', 'CONTEXT', S.candleCount - lastEv.n,
      'The latest pattern was a liquidity sweep; strength may be part of a reversal, not continuation.');
  if (snap.volatility.percentile !== null && snap.volatility.percentile >= 90)
    push('VOL_EXTREME', 'CONTEXT', snap.volatility.percentile,
      `ATR is at the ${Math.round(snap.volatility.percentile)}th percentile of the last 250 candles; ordinary stop distances may behave abnormally.`);
  if (pb && pb.maxPatternAge !== null && typeof ctx.patternAge === 'number' && ctx.patternAge > pb.maxPatternAge)
    push('STALE_PATTERN', 'EXCLUSION', ctx.patternAge,
      `The pattern is ${ctx.patternAge} candles old, beyond this playbook's freshness limit of ${pb.maxPatternAge}.`);
  if (snap.liquidity.targetBeyondSwingHigh && snap.liquidity.distanceToSwingHighATR !== null && snap.liquidity.distanceToSwingHighATR >= 0 && snap.liquidity.distanceToSwingHighATR < 1.5)
    push('TARGET_BLOCKED', 'CONTEXT', snap.liquidity.distanceToSwingHighATR,
      'The first known obstacle is closer than one R while the target lies beyond it.');
  if (snap.relativeStrength.laggard && snap.relativeStrength.spyRoc20 !== null && snap.relativeStrength.spyRoc20 > 0)
    push('RS_LAGGARD', 'CONTEXT', snap.relativeStrength.vsSpy60,
      `This symbol is a watchlist laggard (60-candle RS vs SPY ${(snap.relativeStrength.vsSpy60 * 100).toFixed(1)}%) while SPY is rising.`);
  return out;
}

// ---------- the common analyzer snapshot (ANALYZERS.md contract) ----------
function analyzerSnapshot(feed, sym, ctx = {}) {
  const S = feed.series[sym];
  if (!S) return { state: 'INSUFFICIENT_DATA', analyzerVersion: ANALYZER_VERSION, symbol: sym, signalCandle: null, objections: [] };
  const cs = S.candles, i = cs.length - 1, c = cs[i];
  const dailyState = dailyStateOf(S), intraState = intradayStateOf(S);
  const alignment = dailyState === 'DAILY_UP' && intraState === 'INTRA_UP' ? 'ALIGNED_LONG'
    : dailyState === 'DAILY_UP' ? 'DAILY_SUPPORT_ONLY'
    : dailyState === 'DAILY_DOWN' ? 'AGAINST_LONG'
    : intraState === 'INTRA_UP' ? 'INTRADAY_ONLY' : 'MIXED';
  const pctile = atrPercentileOf(S);
  const volBucket = pctile === null ? 'INSUFFICIENT_DATA' : pctile < 25 ? 'LOW' : pctile < 75 ? 'NORMAL' : pctile < 90 ? 'HIGH' : 'EXTREME';
  const riskFactor = volBucket === 'HIGH' ? 0.75 : volBucket === 'EXTREME' ? 0.50 : 1.00;
  const entry = typeof ctx.entry === 'number' ? ctx.entry : c.close;
  const sessionCandle = ((S.candleCount - 1) % DAY_CANDLES) + 1;
  const snap = {
    state: i >= 35 ? 'OK' : 'INSUFFICIENT_DATA',
    analyzerVersion: ANALYZER_VERSION, symbol: sym, signalCandle: S.candleCount,
    rsi: S.rsi, atr: S.atr,
    mtf: {
      alignment, dailyState, intradayState: intraState,
      reason: `Daily ${dailyState.replace('DAILY_', '')} · intraday ${intraState.replace('INTRA_', '')} → ${alignment} for a long.`,
    },
    regime: regimeOf(S, pctile),
    relativeStrength: rsTable(feed)[sym] || { state: 'INSUFFICIENT_DATA' },
    relativeVolume: (() => {
      const v20 = medianOf(cs.slice(Math.max(0, i - 20), i).map((x) => x.v));
      const v60 = medianOf(cs.slice(Math.max(0, i - 60), i).map((x) => x.v));
      const rvol20 = v20 > 0 ? c.v / v20 : null, rvol60 = v60 > 0 ? c.v / v60 : null;
      const bucket = rvol20 === null ? 'INSUFFICIENT_DATA' : rvol20 < 0.50 ? 'VERY_LOW' : rvol20 < 0.80 ? 'LOW' : rvol20 < 1.25 ? 'NORMAL' : rvol20 < 2.00 ? 'HIGH' : 'VERY_HIGH';
      return { rvol20, rvol60, bucket, signalVolume: c.v };
    })(),
    volatility: {
      atr: S.atr, atrPercent: c.close > 0 ? (S.atr / c.close) * 100 : null,
      percentile: pctile, bucket: volBucket, riskFactor,
    },
    session: {
      sessionCandle,
      phase: sessionCandle <= 30 ? 'OPENING' : sessionCandle <= 120 ? 'MORNING' : sessionCandle <= 270 ? 'MIDDAY' : 'LATE',
    },
    liquidity: {
      swingHigh: S.swingHigh, swingLow: S.swingLow,
      distanceToSwingHighATR: S.swingHigh !== null && S.atr > 0 ? (S.swingHigh - entry) / S.atr : null,
      distanceToSwingLowATR: S.swingLow !== null && S.atr > 0 ? (entry - S.swingLow) / S.atr : null,
      targetBeyondSwingHigh: S.swingHigh !== null && typeof ctx.target === 'number' ? ctx.target > S.swingHigh : false,
    },
    extension: {
      aboveEMA21ATR: S.atr > 0 ? (c.close - S.ema21[i]) / S.atr : null,
      aboveEMA50ATR: S.atr > 0 ? (c.close - S.ema50[i]) / S.atr : null,
      bucket: S.atr > 0 ? ((c.close - S.ema21[i]) / S.atr < 1.0 ? 'NORMAL' : (c.close - S.ema21[i]) / S.atr < 2.0 ? 'EXTENDED' : 'STRETCHED') : 'INSUFFICIENT_DATA',
    },
    objections: [],
  };
  snap.objections = i >= 35 ? generateObjections(S, snap, ctx) : [];
  return snap;
}

// ---------- playbook classifier: exact triggers on the last closed candle ----------
// Returns candidate objects (eligible or not — exclusions ride along as
// measured objection codes so blocked candidates are learning records).
function classifyLatest(feed, sym) {
  const S = feed.series[sym];
  if (!S) return [];
  const cs = S.candles, i = cs.length - 1;
  if (i < 60 || !(S.atr > 0)) return [];
  const c = cs[i], atr = S.atr, raw = [];
  // P-01 — the desk's core EMA cross (unchanged trigger)
  if (i >= 22 && S.ema9[i - 1] <= S.ema21[i - 1] && S.ema9[i] > S.ema21[i]) {
    raw.push({
      playbookId: 'P-01', patternAge: null,
      geometry: {
        crossSeparationATR: (S.ema9[i] - S.ema21[i]) / atr,
        ema50Posture: c.close >= S.ema50[i] ? 'ABOVE' : 'BELOW',
        aboveEMA21BeforeCross: cs[i - 1].close > S.ema21[i - 1],
      },
    });
  }
  // P-02 / P-03 — events emitted by the feed's own state machines this candle
  for (const ev of S.setups.events) raw.push(ev);
  // P-04 — close through the prior ten-candle high, with acceptance quality
  {
    let rangeHigh = -Infinity, rangeLow = Infinity;
    for (let k = i - 10; k < i; k++) { rangeHigh = Math.max(rangeHigh, cs[k].high); rangeLow = Math.min(rangeLow, cs[k].low); }
    const range = c.high - c.low;
    if (c.close > rangeHigh && c.close > c.open && range > 0 && (c.close - c.low) / range >= 0.70
      && range >= 0.75 * atr && c.close > S.ema21[i] && S.rsi < 70) {
      raw.push({
        playbookId: 'P-04', patternAge: 0,
        geometry: { rangeHigh, breakDistanceATR: (c.close - rangeHigh) / atr, preBreakRangeWidthATR: (rangeHigh - rangeLow) / atr, candleRangeATR: range / atr },
      });
    }
    // P-05 — sweep below the prior ten-candle low, reclaimed on the close
    const prevRsi = typeof cs[i - 1].rsi === 'number' ? cs[i - 1].rsi : null;
    if (c.low < rangeLow && c.close > rangeLow && c.close > c.open && (S.rsi <= 50 || (prevRsi !== null && S.rsi > prevRsi))) {
      raw.push({
        playbookId: 'P-05', patternAge: 0,
        geometry: { rangeLow, sweepDepthATR: (rangeLow - c.low) / atr, reclaimStrengthATR: (c.close - rangeLow) / atr, rangeWidthATR: (rangeHigh - rangeLow) / atr },
      });
    }
  }
  // P-09 — RS leader wrapper: replaces its underlying P-01/P-04 candidate
  const rs = rsTable(feed)[sym];
  const under = raw.filter((r) => r.playbookId === 'P-01' || r.playbookId === 'P-04');
  if (under.length && rs && rs.leader) {
    const dailyAbove21 = (X) => { const D = X.daily, n = D.candles.length; return n >= 21 && D.candles[n - 1].close > D.ema21[n - 1]; };
    const spyS = feed.series.SPY;
    if (spyS && dailyAbove21(spyS) && dailyAbove21(S) && c.close > S.ema21[i] && c.close > S.ema50[i]) {
      const base = under.find((r) => r.playbookId === 'P-04') || under[0];
      for (let k = raw.length - 1; k >= 0; k--) if (raw[k] === base) raw.splice(k, 1);
      raw.push({
        playbookId: 'P-09', patternAge: 0, underlyingPlaybookId: base.playbookId,
        underlyingPlaybookIds: under.map((r) => r.playbookId),
        geometry: { underlying: base.playbookId, rsRank60: rs.rank60, roc60: rs.roc60, vsSpy60: rs.vsSpy60, leadOverThird60: rs.leadOverThird60, ...base.geometry },
      });
    }
  }
  return raw.map((r) => {
    const pb = PLAYBOOKS[r.playbookId];
    const entry = c.close, stop = entry - 1.5 * atr, target = entry + 3 * atr;
    const snapshot = analyzerSnapshot(feed, sym, { playbookId: r.playbookId, entry, stop, target, patternAge: r.patternAge });
    const exclusions = snapshot.objections.filter((o) => o.force === 'EXCLUSION');
    return {
      sym, playbookId: r.playbookId, playbookVersion: pb.version, playbookName: pb.name, family: pb.family,
      underlyingPlaybookId: r.underlyingPlaybookId || null,
      triggerTimeframe: '1m', signalCandle: S.candleCount,
      entry, stop, target, atr, rsi: S.rsi,
      patternAge: r.patternAge, patternGeometry: r.geometry || {}, patternContext: S.lastPattern,
      snapshot, eligible: snapshot.state !== 'INSUFFICIENT_DATA' && exclusions.length === 0,
      exclusionCodes: exclusions.map((o) => o.code),
    };
  });
}

// ---- shared formatting ----
function fmtPrice(p) {
  if (p >= 10000) return p.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtVol(v) {
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(2) + 'K';
  return String(Math.round(v));
}
function fmtMoney(v) {
  const s = v < 0 ? '-$' : '$';
  return s + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtSigned(v) {
  return (v < 0 ? '-$' : '+$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ================= STATS ENGINE =================
// ============================================================ STATS ENGINE
// Every number on the performance layer is computed here, from the
// actual closed-trade records — nothing decorative. Two books are kept
// apart: FORWARD (live SIM chain trades) and REHEARSAL (frozen-day
// replays). They share lane knowledge (benching) but the live-money
// GATE tracker counts FORWARD trades only.
// Bench rule (C-LO): a lane whose profit factor over its last 8 closed
// trades falls below 1.0 is auto-benched — the chain suppresses its
// proposals until C-LO reinstates the lane. SUPERBASE extends the same
// test to four lane levels: FAMILY, SYMBOL, PLAYBOOK and
// PLAYBOOK × SYMBOL. The broadest applicable active bench controls.
// Closed trades carry the full learning record (playbook ID/version +
// analyzer snapshot at signal time); blocked / benched / denied /
// expired candidates are logged as candidate EVENTS — never as trades.

function famKey(pattern) { return pattern || 'EMA'; }
function pbKey(t) { return (t && t.playbookId) || 'P-01'; }
const BENCH_RULE_VERSION = 'BENCH-PF8-1.0';

function createStats() {
  const trades = [];                                   // full learning records (see desk.recordClose)
  const curves = { forward: [10000], rehearsal: [10000] };
  const benched = new Map();                           // 'FAM:x' | 'SYM:x' | 'PB:P-01' | 'PBS:P-01:NVDA'
  const probation = new Map();                         // lane key -> { closes } after a C-LO reinstatement
  const candidateEvents = [];                          // candidate lifecycle, separate from trades
  const calibration = [];                              // scenario estimate vs outcome records
  let tradeSeq = 0, candSeq = 0, proposalSeq = 0;

  function agg(list) {
    let wins = 0, gw = 0, gl = 0, pnl = 0, r = 0;
    for (const t of list) {
      pnl += t.pnl; r += t.R;
      if (t.pnl >= 0) { wins++; gw += t.pnl; } else gl -= t.pnl;
    }
    const n = list.length;
    return {
      n, wins, winPct: n ? (wins / n) * 100 : 0,
      pf: gl > 0 ? gw / gl : (gw > 0 ? Infinity : 0),
      expUsd: n ? pnl / n : 0, expR: n ? r / n : 0, pnl,
      forwardN: list.filter((t) => !t.rehearsal).length,
      rehearsalN: list.filter((t) => t.rehearsal).length,
    };
  }
  function maxDD(curve) {
    let peak = curve[0], mdd = 0, mddPct = 0;
    for (const v of curve) {
      peak = Math.max(peak, v);
      if (peak - v > mdd) { mdd = peak - v; mddPct = peak > 0 ? (mdd / peak) * 100 : 0; }
    }
    return { usd: mdd, pct: mddPct };
  }
  function laneList(kind, key, rehearsal) {
    return trades.filter((t) => {
      if (rehearsal !== undefined && t.rehearsal !== rehearsal) return false;
      if (kind === 'FAM') return famKey(t.family) === key;
      if (kind === 'SYM') return t.sym === key;
      if (kind === 'PB') return pbKey(t) === key;
      if (kind === 'PBS') { const ix = key.indexOf(':'); return pbKey(t) === key.slice(0, ix) && t.sym === key.slice(ix + 1); }
      return false;
    });
  }
  const laneKeysOf = (t) => [
    ['FAM', famKey(t.family), famKey(t.family)],
    ['SYM', t.sym, t.sym],
    ['PB', pbKey(t), pbKey(t)],
    ['PBS', `${pbKey(t)}:${t.sym}`, `${pbKey(t)} on ${t.sym}`],
  ];
  function recentWindow(kind, key, n = 8) {
    const list = laneList(kind, key).slice(-n);
    return list.length < n ? null : list;
  }

  const S = {
    trades, curves, benched, probation, candidateEvents, calibration,
    record(t) {
      if (t.id === undefined || t.id === null) t.id = ++tradeSeq; else tradeSeq = Math.max(tradeSeq, t.id);
      trades.push(t);
      const book = t.rehearsal ? 'rehearsal' : 'forward';
      curves[book].push(curves[book][curves[book].length - 1] + t.pnl);
      // bench check on every lane this trade belongs to (same approved rule)
      const newly = [];
      for (const [kind, key, label] of laneKeysOf(t)) {
        const bkey = `${kind}:${key}`;
        const prob = probation.get(bkey);
        if (prob) { prob.closes++; if (prob.closes >= 8 && !benched.has(bkey)) probation.delete(bkey); }
        if (benched.has(bkey)) continue;
        const win = recentWindow(kind, key, 8);
        if (!win) continue;
        const a = agg(win);
        if (a.pf < 1.0) {
          const b = {
            key: bkey, kind, label, pf: a.pf, n: 8, expR: a.expR,
            tradeIds: win.map((x) => x.id),
            bookMix: { forward: win.filter((x) => !x.rehearsal).length, rehearsal: win.filter((x) => x.rehearsal).length },
            ruleVersion: BENCH_RULE_VERSION,
          };
          benched.set(bkey, b); newly.push(b);
          probation.delete(bkey);
        }
      }
      return newly;
    },
    forward: () => agg(trades.filter((t) => !t.rehearsal)),
    rehearsalAgg: () => agg(trades.filter((t) => t.rehearsal)),
    all: () => agg(trades),
    maxDDForward: () => maxDD(curves.forward),
    equityForward: () => curves.forward[curves.forward.length - 1],
    equityRehearsal: () => curves.rehearsal[curves.rehearsal.length - 1],
    byFamily() {
      const keys = [...new Set(trades.map((t) => famKey(t.family)))];
      return keys.map((k) => ({ key: k, ...agg(laneList('FAM', k)) })).sort((a, b) => b.n - a.n);
    },
    bySymbol() {
      const keys = [...new Set(trades.map((t) => t.sym))];
      return keys.map((k) => ({ key: k, ...agg(laneList('SYM', k)) })).sort((a, b) => b.n - a.n);
    },
    byPlaybook() {
      const keys = [...new Set(trades.map((t) => pbKey(t)))];
      return keys.map((k) => {
        const list = laneList('PB', k);
        const exits = {};
        for (const t of list) { const r = String(t.reason || '').split(' ')[0]; exits[r] = (exits[r] || 0) + 1; }
        const dominantExit = Object.keys(exits).sort((a, b) => exits[b] - exits[a])[0] || null;
        return { key: k, ...agg(list), benched: benched.has('PB:' + k), dominantExit };
      }).sort((a, b) => b.n - a.n);
    },
    byPlaybookSymbol() {
      const keys = [...new Set(trades.map((t) => `${pbKey(t)}:${t.sym}`))];
      return keys.map((k) => ({ key: k, ...agg(laneList('PBS', k)) })).sort((a, b) => b.n - a.n);
    },
    // the setup record a proposal card shows: this family ON this symbol (legacy lane)
    laneRecord(family, sym) {
      const list = trades.filter((t) => famKey(t.family) === famKey(family) && t.sym === sym);
      return agg(list);
    },
    // the SUPERBASE lane record: this playbook ON this symbol
    playbookSymbolRecord(playbookId, sym) {
      return agg(laneList('PBS', `${playbookId}:${sym}`));
    },
    // evidence score (LEARNING-LOOP): expectancyR shrunk by sample size — ordering only
    evidenceScore(playbookId, sym) {
      const a = S.playbookSymbolRecord(playbookId, sym);
      return { score: a.expR * (a.n / (a.n + 20)), n: a.n, expR: a.expR, pf: a.pf };
    },
    isBenched(family, sym, playbookId) {
      if (benched.has(`FAM:${famKey(family)}`) || benched.has(`SYM:${sym}`)) return true;
      if (playbookId) {
        if (benched.has(`PB:${playbookId}`) || benched.has(`PBS:${playbookId}:${sym}`)) return true;
      }
      return false;
    },
    benchedLanes: () => [...benched.values()],
    reinstate(key) {
      if (!benched.has(key)) return;
      benched.delete(key);
      probation.set(key, { closes: 0 });   // reinstated lanes are probationary for their next 8 closes
    },
    // ---------- candidate events (never trades, never P&L) ----------
    recordCandidate(ev) {
      ev.id = ++candSeq;
      ev.outcome = ev.outcome || 'queued';
      candidateEvents.push(ev);
      return ev.id;
    },
    updateCandidate(id, patch) {
      const e = candidateEvents.find((x) => x.id === id);
      if (e) Object.assign(e, patch);
      return e || null;
    },
    candidateOutcomes() {
      const counts = {};
      for (const e of candidateEvents) counts[e.outcome] = (counts[e.outcome] || 0) + 1;
      return counts;
    },
    // ---------- scenario calibration ----------
    recordCalibration(rec) { calibration.push(rec); return rec; },
    resolveCalibration(proposalId, outcome, realizedR) {
      const c = calibration.find((x) => x.proposalId === proposalId && !x.outcome);
      if (c) { c.outcome = outcome; c.realizedR = realizedR; }
      return c || null;
    },
    calibrationSummary() {
      const dec = calibration.filter((c) => c.outcome === 'TARGET_FIRST' || c.outcome === 'STOP_FIRST');
      const buckets = {};
      for (const c of dec) {
        const lo = Math.floor(c.predictedTargetFirst * 10) * 10;
        const k = `${lo}-${lo + 9}%`;
        buckets[k] = buckets[k] || { n: 0, predSum: 0, hits: 0 };
        buckets[k].n++; buckets[k].predSum += c.predictedTargetFirst;
        if (c.outcome === 'TARGET_FIRST') buckets[k].hits++;
      }
      const bucketList = Object.entries(buckets).map(([k, b]) => ({
        bucket: k, n: b.n, predicted: b.predSum / b.n, observed: b.hits / b.n, error: b.hits / b.n - b.predSum / b.n,
      }));
      const brier = dec.length
        ? dec.reduce((s, c) => s + Math.pow(c.predictedTargetFirst - (c.outcome === 'TARGET_FIRST' ? 1 : 0), 2), 0) / dec.length : null;
      const expRError = dec.length
        ? dec.reduce((s, c) => s + ((typeof c.realizedR === 'number' ? c.realizedR : 0) - c.expectedR), 0) / dec.length : null;
      return { recorded: calibration.length, decisive: dec.length, nonDecisive: calibration.length - dec.length, buckets: bucketList, brier, expRError };
    },
    gate() { const f = S.forward(); return { n: f.n, pf: f.pf, need: 30, pfNeed: 1.2, met: f.n >= 30 && f.pf > 1.2 }; },
    scorecard() {
      const f = S.forward(), r = S.rehearsalAgg(), all = S.all();
      const lanes = [
        ...S.byFamily().map((l) => ({ ...l, kind: 'FAM' })),
        ...S.bySymbol().map((l) => ({ ...l, kind: 'SYM' })),
        ...S.byPlaybook().map((l) => ({ ...l, kind: 'PB' })),
        ...S.byPlaybookSymbol().map((l) => ({ ...l, kind: 'PBS' })),
      ].filter((l) => l.n >= 3);
      const laneTxt = (l) => `${l.key} (${l.kind}) ${l.expR >= 0 ? '+' : ''}${l.expR.toFixed(2)}R · n=${l.n}${l.n < 8 ? ' · unproven' : ''}`;
      const best = lanes.length ? lanes.reduce((a, b) => (b.expR > a.expR ? b : a)) : null;
      const worst = lanes.length ? lanes.reduce((a, b) => (b.expR < a.expR ? b : a)) : null;
      // context slices (cells under 8 trades are observations only)
      const slice = (fn) => {
        const groups = {};
        for (const t of trades) { const k = fn(t); if (k === null || k === undefined) continue; (groups[k] = groups[k] || []).push(t); }
        return Object.entries(groups).map(([k, list]) => ({ key: k, ...agg(list) })).sort((a, b) => b.n - a.n);
      };
      const context = {
        regime: slice((t) => t.snapshot && t.snapshot.regime && t.snapshot.regime.label),
        alignment: slice((t) => t.snapshot && t.snapshot.mtf && t.snapshot.mtf.alignment),
        session: slice((t) => t.snapshot && t.snapshot.session && t.snapshot.session.phase),
        rvol: slice((t) => t.snapshot && t.snapshot.relativeVolume && t.snapshot.relativeVolume.bucket),
        volatility: slice((t) => t.snapshot && t.snapshot.volatility && t.snapshot.volatility.bucket),
        scenarioGrade: slice((t) => t.scenario && t.scenario.grade),
      };
      const playbooks = S.byPlaybook();
      const calib = S.calibrationSummary();
      const selection = S.candidateOutcomes();
      const versions = {};
      for (const t of trades) { const v = `${pbKey(t)} v${t.playbookVersion || '1.0'}`; versions[v] = (versions[v] || 0) + 1; }
      const sigCandles = trades.map((t) => t.signalCandle).filter((x) => typeof x === 'number');
      proposalSeq++;
      const date = new Date().toISOString().slice(0, 10);
      let change, observation, evidence, problem;
      const confirmLane = playbooks.find((l) => l.forwardN >= 30 && l.pf > 1.2 && l.expUsd > 0 && l.expR > 0);
      const weakLane = playbooks.filter((l) => l.n >= 8 && l.pf < 1.0).sort((a, b) => a.pf - b.pf)[0];
      const strongLane = playbooks.filter((l) => l.n >= 8 && l.pf >= 1.5).sort((a, b) => b.expR - a.expR)[0];
      if (confirmLane) {
        observation = `Playbook ${confirmLane.key} is a lane-confirmation candidate: ${confirmLane.forwardN} forward trades, PF ${confirmLane.pf.toFixed(2)}, expectancy ${confirmLane.expR >= 0 ? '+' : ''}${confirmLane.expR.toFixed(2)}R.`;
        evidence = `Lane PB:${confirmLane.key} · sample ${confirmLane.n} (forward ${confirmLane.forwardN} / rehearsal ${confirmLane.rehearsalN}) · PF ${confirmLane.pf.toFixed(2)} · expectancy $${confirmLane.expUsd.toFixed(2)} / ${confirmLane.expR.toFixed(2)}R · version ${confirmLane.key} v1.0.`;
        problem = 'Its evidence score uses the standard shrinkage, so a confirmed lane still competes for attention as if its sample were thinner than it is.';
        change = `Evidence-score shrinkage for ${confirmLane.key} candidate ORDERING: expectancyR × n/(n+20) -> expectancyR × n/(n+10). Ordering only — size, stop, target and mode unchanged.`;
      } else if (weakLane) {
        observation = `Playbook ${weakLane.key} is losing: PF ${weakLane.pf.toFixed(2)} over ${weakLane.n} closes, expectancy ${weakLane.expR.toFixed(2)}R${weakLane.benched ? ' (lane already benched under the approved rule)' : ''}.`;
        evidence = `Lane PB:${weakLane.key} · sample ${weakLane.n} (forward ${weakLane.forwardN} / rehearsal ${weakLane.rehearsalN}) · PF ${weakLane.pf.toFixed(2)} · expectancy $${weakLane.expUsd.toFixed(2)} / ${weakLane.expR.toFixed(2)}R.`;
        problem = 'The bench test reads only the last 8 closes; a lane can oscillate around the threshold and churn in and out of rotation.';
        change = `Playbook bench review window for ${weakLane.key}: last-8 PF < 1.0 -> last-12 PF < 1.0 (bench threshold unchanged at PF 1.0).`;
      } else if (strongLane) {
        observation = `Playbook ${strongLane.key} leads the measured lanes: PF ${strongLane.pf.toFixed(2)} over ${strongLane.n} closes, expectancy ${strongLane.expR >= 0 ? '+' : ''}${strongLane.expR.toFixed(2)}R.`;
        evidence = `Lane PB:${strongLane.key} · sample ${strongLane.n} (forward ${strongLane.forwardN} / rehearsal ${strongLane.rehearsalN}) · PF ${strongLane.pf.toFixed(2)} · expectancy $${strongLane.expUsd.toFixed(2)} / ${strongLane.expR.toFixed(2)}R.`;
        problem = 'Attention order still treats this lane like an unmeasured one, so weaker-evidence candidates can win the single position first.';
        change = `Evidence-score shrinkage for ${strongLane.key} candidate ORDERING: expectancyR × n/(n+20) -> expectancyR × n/(n+12). Ordering only — size, stop, target and mode unchanged.`;
      } else {
        observation = `No lane has 8+ closes with a decisive record yet (${all.n} closed trades total; forward ${f.n} / rehearsal ${r.n}).`;
        evidence = `Desk sample ${all.n} · forward PF ${f.pf === Infinity ? '∞' : f.pf.toFixed(2)} · expectancy ${f.expR >= 0 ? '+' : ''}${f.expR.toFixed(2)}R · gate ${f.n}/30 forward.`;
        problem = 'Changing any rule on this sample would be fitting noise; the desk cannot yet tell skill from variance.';
        change = 'Rule set v1.0 -> rule set v1.0 (no change). Keep measuring until a lane reaches the evidence standards.';
      }
      const proposalObj = {
        id: `G-${date.replace(/-/g, '')}-${proposalSeq}`, date, owner: 'Growth',
        observation, evidence, problem, change,
        risk: 'Any change is validated only on later forward trades; the sample that suggested it cannot confirm it. Ordering changes can starve other lanes of samples.',
        validation: 'Next 30 forward closed trades after the effective point, compared lane-by-lane against the pre-change record; minimum 8 closes in the affected lane.',
        rollback: 'If the affected lane benches under the approved PF rule during validation, or desk forward PF falls below 1.0 over the validation window, the old rule returns.',
        decision: 'C-LO APPROVE / DENY', effectivePoint: 'On C-LO approval — the next forward candle close after approval.',
      };
      const proposal = [
        `PROPOSAL ${proposalObj.id} / ${date}`,
        'Owner: Growth',
        `Observation: ${observation}`,
        `Evidence: ${evidence}`,
        `Problem: ${problem}`,
        `Exact change: ${change}`,
        `Risk of change: ${proposalObj.risk}`,
        `Validation: ${proposalObj.validation}`,
        `Rollback: ${proposalObj.rollback}`,
        'Decision: C-LO APPROVE / DENY',
        `Effective point: ${proposalObj.effectivePoint}`,
      ].join('\n');
      return {
        pnl: f.pnl, expR: f.expR, expUsd: f.expUsd, pf: f.pf, winPct: f.winPct, n: f.n,
        best: best ? laneTxt(best) : '—',
        worst: worst ? laneTxt(worst) : '—',
        benched: S.benchedLanes().map((b) => b.label),
        proposal, proposalObj, playbooks, context,
        calibration: calib, selection,
        sample: {
          forwardN: f.n, rehearsalN: r.n, totalN: all.n, versions,
          candleSpan: sigCandles.length ? [Math.min(...sigCandles), Math.max(...sigCandles)] : null,
          probationary: [...probation.keys()],
        },
        maxDD: maxDD(curves.forward),
      };
    },
  };
  return S;
}

// ================= SCENARIO ENGINE (SUPERBASE) =================
// ============================================================ SCENARIO ENGINE
// SUPERBASE Scenario Engine v1 (knowledge/SCENARIO-ENGINE.md).
// Block bootstrap of the symbol's OWN closed 1-minute log returns:
// blocks of 12 consecutive returns sampled with replacement, paths
// start exactly at the candidate entry and run at most 240 steps,
// barriers checked at each simulated close. The seed is derived from
// symbol + decision candle + data end point + quantized levels, so
// the same candidate on the same history reproduces the same result.
// Results are gross / before costs (the desk models no spread, fees
// or slippage) and are an estimate, never a prediction. The gate is
// DISABLED by default — advisory only until C-LO enables thresholds.

const SCENARIO_METHOD_VERSION = 'SB-SCENARIO-1.0';
const SCENARIO_STANDARD_PATHS = 2000;
const HORIZON = 240, BLOCK = 12, HISTORY = 1950, MIN_HISTORY = 1000;

function hashSeed(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const q4 = (x) => Math.round(x * 10000) / 10000;
const medianSorted = (sorted) => {
  const m = sorted.length >> 1;
  return sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
};

// S = the symbol's feed series; decisionCandle = feed candleCount at signal.
function runScenario({ S, symbol, decisionCandle, entry, stop, target, paths = SCENARIO_STANDARD_PATHS }) {
  const endIdx = Math.min(decisionCandle, S.candles.length) - 1;
  const rets = [];
  for (let k = Math.max(1, endIdx - HISTORY + 1); k <= endIdx; k++) {
    const r = Math.log(S.candles[k].close / S.candles[k - 1].close);
    if (Number.isFinite(r)) rets.push(r);
  }
  const base = {
    symbol, decisionCandle, methodVersion: SCENARIO_METHOD_VERSION,
    historyReturns: rets.length, historyStart: endIdx - rets.length + 1, historyEnd: endIdx,
    paths: 0, horizonCandles: HORIZON, gateEnabled: false,
  };
  if (rets.length < MIN_HISTORY || !(entry > stop) || !(target > entry)) {
    return {
      ...base, estimateState: 'INSUFFICIENT_DATA', seed: null,
      targetFirstProbability: null, stopFirstProbability: null, timeoutProbability: null,
      expectedR: null, medianR: null, rP10: null, rP90: null, medianCandlesToOutcome: null, grade: null,
      display: 'Scenario estimate: INSUFFICIENT_DATA — fewer than 1,000 eligible closed 1-minute returns for this symbol; no estimate was fabricated.',
    };
  }
  const seed = hashSeed(`${symbol}|${decisionCandle}|${q4(S.candles[endIdx].close)}|${q4(entry)}|${q4(stop)}|${q4(target)}`);
  const rnd = mulberry32(seed);
  const risk = entry - stop, targetR = (target - entry) / risk;
  const maxStart = rets.length - BLOCK;
  let nT = 0, nS = 0, nTO = 0, sumR = 0;
  const rs = [], stepsArr = [];
  for (let p = 0; p < paths; p++) {
    let price = entry, outcome = null, steps = HORIZON, finalR = 0, k = 0;
    while (k < HORIZON && !outcome) {
      let s = Math.floor(rnd() * (maxStart + 1));
      if (s > maxStart) s = maxStart;
      for (let b = 0; b < BLOCK && k < HORIZON; b++, k++) {
        price *= Math.exp(rets[s + b]);
        if (price >= target) { outcome = 'TARGET_FIRST'; steps = k + 1; finalR = targetR; break; }
        if (price <= stop) { outcome = 'STOP_FIRST'; steps = k + 1; finalR = -1; break; }
      }
    }
    if (!outcome) { outcome = 'TIMEOUT'; finalR = (price - entry) / risk; }
    if (outcome === 'TARGET_FIRST') nT++; else if (outcome === 'STOP_FIRST') nS++; else nTO++;
    rs.push(finalR); stepsArr.push(steps); sumR += finalR;
  }
  const sortedR = [...rs].sort((a, b) => a - b), sortedSteps = [...stepsArr].sort((a, b) => a - b);
  const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(p * arr.length)))];
  const pT = nT / paths, pS = nS / paths, pTO = nTO / paths, expR = sumR / paths;
  const grade = pT >= 0.55 && expR >= 0.20 ? 'FAVORABLE' : (expR <= 0 || pT < 0.45) ? 'UNFAVORABLE' : 'NEUTRAL';
  const display = `Scenario estimate: Target first in ${(pT * 100).toFixed(1)}% of ${paths.toLocaleString('en-US')} simulated paths; expected value ${expR >= 0 ? '+' : ''}${expR.toFixed(2)}R before costs. Stop first ${(pS * 100).toFixed(1)}%, timeout ${(pTO * 100).toFixed(1)}%. Paths were bootstrapped from this symbol's last ${rets.length.toLocaleString('en-US')} closed 1-minute returns (five SIM days). This is a historical-path estimate, not a prediction.`;
  return {
    ...base, paths, estimateState: 'COMPLETE', seed,
    targetFirstProbability: pT, stopFirstProbability: pS, timeoutProbability: pTO,
    expectedR: expR, medianR: medianSorted(sortedR), rP10: pct(sortedR, 0.10), rP90: pct(sortedR, 0.90),
    medianCandlesToOutcome: medianSorted(sortedSteps), grade, display,
  };
}

// ================= BOT CHAIN + BOOK =================
// ============================================================ HOLO DESK — BOT CHAIN + BOOK
// The Six-Bot Desk, paper only, locked rules carried over from Stage 4:
// EMA 9/21 cross + RSI 14 < 70 entries, 10% size, stop 1.5×ATR, target
// 3×ATR, 5% daily-loss risk stop. Every bot runs its station
// AUTONOMOUSLY: Scanner rotates the whole watchlist and raises
// candidates on its own; Analysis verifies and writes the bear
// objection; Strategy drafts the plan; Risk sizes and enforces the
// brakes (daily loss, bench list, one position at a time); Execution
// manages exits automatically at the levels. ENTRIES obey the
// execution mode — C-LO's standing decision (2026-10-28): APPROVE.
// His yes on every entry; everything else is automated.
//
// SUPERBASE (knowledge/): Scanner's classifier tags every candidate
// with its playbook (P-01 EMA cross, P-02 pullback, P-03 FVG
// continuation, P-04 BOS, P-05 sweep reversal, P-09 RS leader) and a
// full analyzer snapshot at signal time. Competing candidates queue
// and are picked by evidence score → RS rank → signal order (ordering
// only — never size). Strategy runs the 2,000-path scenario batch per
// proposal (advisory only; the scenario gate is DISABLED until C-LO
// enables it). Risk applies the volatility percentile as a
// reduce-only factor after the locked size and cap. Every close is a
// full learning record in the stats engine; lanes (family / symbol /
// playbook / playbook×symbol) under PF 1.0 over their last 8 closes
// are auto-benched until C-LO reinstates. Growth reviews every trade
// and posts a scorecard every 10 closes — proposals are display only.





const BOTS = [
  { key: 'scanner',   label: 'SCANNER',   color: '#22D3EE' },
  { key: 'analysis',  label: 'ANALYSIS',  color: '#A78BFA' },
  { key: 'strategy',  label: 'STRATEGY',  color: '#F59E0B' },
  { key: 'risk',      label: 'RISK',      color: '#EF4444' },
  { key: 'execution', label: 'EXECUTION', color: '#22C55E' },
  { key: 'growth',    label: 'GROWTH',    color: '#EAB308' },
];
const MODES = ['approve', 'auto', 'leashed'];

const PATTERN_NAME = { FVG: 'FAIR VALUE GAP', BOS: 'BREAK OF STRUCTURE', LS: 'LIQUIDITY SWEEP' };
function patternName(f) { return PATTERN_NAME[f] || 'EMA CROSS'; }
function playbookName(id) { return (PLAYBOOKS[id] || {}).name || 'EMA-CROSS TREND ENTRY'; }
const KIND_TXT = { FAM: 'family', SYM: 'symbol', PB: 'playbook', PBS: 'playbook × symbol' };

function createDesk(feed, log, opts = {}) {
  const today = () => new Date().toISOString().slice(0, 10);
  const stats = createStats();
  const D = {
    equity: 10000, dayStartEquity: 10000, utcDate: today(), stoppedDate: null,
    selected: 'AAPL',
    position: null, proposal: null,
    stats, chainVersion: 0, onEvent: null,
    mode: MODES.includes(opts.mode) ? opts.mode : 'approve',
    leashCap: opts.leashCap || 5, entriesToday: 0,
    scanIdx: 1, _closesSinceFind: 0,
    _run: null, _resetT: 0, _nextId: 1,
    candidateQueue: [],
    // Scenario gate: DISABLED until C-LO sets thresholds and enables it.
    scenarioGateEnabled: false, scenarioMinTargetFirst: null, scenarioMinExpectedR: null,
    scenarioBatches: 0, scenarioPaths: 0,
  };
  const emit = (type, payload) => { if (D.onEvent) D.onEvent(type, payload); };
  const chain = {};
  for (const b of BOTS) chain[b.key] = { state: 'idle', verdict: b.key === 'scanner' ? 'SCANNING' : '—' };
  D.chain = chain;
  const setChip = (key, state, verdict) => { chain[key] = { state, verdict }; D.chainVersion++; };
  const resetChain = () => { for (const b of BOTS) setChip(b.key, 'idle', b.key === 'scanner' ? 'SCANNING' : '—'); };

  function equityNow() {
    if (!D.position) return D.equity;
    const S = feed.series[D.position.sym];
    return D.equity + (S.price - D.position.entry) * D.position.qty;
  }
  D.equityNow = equityNow;
  D.dayDD = () => (D.dayStartEquity - equityNow()) / D.dayStartEquity;

  // ---------- gates (read ONLY feed-computed state) ----------
  function scannerGate(S) {
    const i = S.candles.length - 1;
    if (i < 22) return false;
    return S.ema9[i - 1] <= S.ema21[i - 1] && S.ema9[i] > S.ema21[i];
  }
  function crossDown(S) {
    const i = S.candles.length - 1;
    return i >= 22 && S.ema9[i - 1] >= S.ema21[i - 1] && S.ema9[i] < S.ema21[i];
  }
  function strategyPlan(S) {
    const entry = S.candles[S.candles.length - 1].close;
    const stop = entry - 1.5 * S.atr, target = entry + 3 * S.atr;
    const rr = (target - entry) / (entry - stop);
    if (!(rr >= 1.5) || !(S.atr > 0)) return null;
    return { entry, stop, target, rr, pattern: S.lastPattern };
  }
  function analysisGate(S, plan) {
    const parts = [];
    if (S.rsi >= 60) parts.push(`RSI ${S.rsi.toFixed(0)} — hot, limited headroom before overbought`);
    if (S.swingHigh && plan.entry < S.swingHigh && (S.swingHigh - plan.entry) < 0.75 * S.atr)
      parts.push(`price only ${((S.swingHigh - plan.entry) / S.atr).toFixed(1)}×ATR under swing-high liquidity at ${S.swingHigh.toFixed(2)} — rejection risk`);
    if (S.lastPattern === 'LS') parts.push('last pattern was a LIQUIDITY SWEEP — reversal risk into strength');
    if (S.ema50.length && S.price < S.ema50[S.ema50.length - 1]) parts.push('price under EMA 50 — trading against the larger trend');
    const objection = parts.length ? parts.join('; ') + '.' : 'none flagged — trend and pattern aligned.';
    if (S.rsi >= 70) return { pass: false, objection };
    return { pass: true, objection };
  }
  function riskSize(plan, equity) {
    let qty = (equity * 0.10) / plan.entry;                  // 10% size (locked)
    let riskAmt = qty * (plan.entry - plan.stop);
    let reduced = false;
    if (riskAmt > equity * 0.025) {                          // 2.5% single-trade risk cap
      qty = (equity * 0.025) / (plan.entry - plan.stop);
      riskAmt = qty * (plan.entry - plan.stop);
      reduced = true;
    }
    return { qty, riskAmt, reduced };
  }
  // Analysis on a SUPERBASE candidate: the snapshot's measured objection
  // generators are the bear case; RSI ≥ 70 stays the existing hard block.
  function candidateObjection(cand) {
    const obs = (cand.snapshot && cand.snapshot.objections) || [];
    if (!obs.length) return 'none flagged — trend and pattern aligned.';
    return obs.map((o) => o.text).join(' ');
  }

  // ---------- candidate intake + priority queue (Scanner) ----------
  function intakeCandidates(sym) {
    const cands = classifyLatest(feed, sym);
    for (const cand of cands) {
      cand.candidateEventId = stats.recordCandidate({
        sym, playbookId: cand.playbookId, playbookVersion: cand.playbookVersion, family: cand.family,
        signalCandle: cand.signalCandle, entry: cand.entry, stop: cand.stop, target: cand.target,
        snapshot: cand.snapshot, patternGeometry: cand.patternGeometry, patternAge: cand.patternAge,
        objectionCodes: ((cand.snapshot && cand.snapshot.objections) || []).map((o) => o.code),
        outcome: cand.eligible ? 'queued' : 'blocked',
        blockedReason: cand.eligible ? null : cand.exclusionCodes.join(', '),
      });
      if (!cand.eligible) continue;
      const ev = stats.evidenceScore(cand.playbookId, sym);
      cand.priority = {
        evidenceScore: ev.score, laneN: ev.n, laneExpR: ev.expR,
        rsRank: cand.snapshot && cand.snapshot.relativeStrength ? (cand.snapshot.relativeStrength.rank60 ?? null) : null,
      };
      if (stats.isBenched(cand.family, sym, cand.playbookId)) {
        stats.updateCandidate(cand.candidateEventId, { outcome: 'benched' });
        continue;
      }
      D.candidateQueue.push(cand);
      D._closesSinceFind = 0;
    }
  }
  function pickCandidate() {
    const q = D.candidateQueue.splice(0, D.candidateQueue.length);
    q.sort((a, b) =>
      (b.priority.evidenceScore - a.priority.evidenceScore) ||
      ((a.priority.rsRank ?? 99) - (b.priority.rsRank ?? 99)) ||
      (a.signalCandle - b.signalCandle) ||
      (PLAYBOOK_ORDER.indexOf(a.playbookId) - PLAYBOOK_ORDER.indexOf(b.playbookId)));
    const pick = q[0];
    for (const other of q.slice(1)) {
      stats.updateCandidate(other.candidateEventId, { outcome: 'superseded', supersededBy: pick.candidateEventId });
    }
    return pick;
  }

  // ---------- chain run (autonomous, timed stages) ----------
  function startRun(cand) {
    D._run = {
      sym: cand.sym, candidate: cand, stage: 'analysis', t: 0, objection: '', scenario: null,
      plan: { entry: cand.entry, stop: cand.stop, target: cand.target, rr: (cand.target - cand.entry) / (cand.entry - cand.stop), pattern: cand.patternContext },
    };
    D._closesSinceFind = 0;
    setChip('scanner', 'pass', `LOCKED: ${cand.sym}`);
    setChip('analysis', 'working', 'VERIFYING…');
    log('scanner', `SCANNER → ${cand.sym}: ${cand.playbookId} ${cand.playbookName} trigger on candle ${cand.signalCandle}${cand.playbookId === 'P-01' ? ' (EMA 9/21 cross-up)' : ''}. Candidate handed to Analysis — priority evidence ${cand.priority.evidenceScore >= 0 ? '+' : ''}${cand.priority.evidenceScore.toFixed(2)} (lane n=${cand.priority.laneN}) · RS rank ${cand.priority.rsRank ?? '—'}.`);
    emit('candidate', { sym: cand.sym, playbookId: cand.playbookId });
  }
  function failRun(botKey, verdict, msg, sym) {
    if (D._run && D._run.candidate) {
      stats.updateCandidate(D._run.candidate.candidateEventId, {
        outcome: verdict === 'BENCHED' ? 'benched' : 'blocked', blockedBy: botKey,
      });
    }
    setChip(botKey, 'fail', verdict);
    log(botKey, msg);
    emit('gatefail', { sym, bot: botKey });
    D._run = null; D._resetT = 2.4;
  }
  function advanceRun() {
    const run = D._run, S = feed.series[run.sym], cand = run.candidate;
    if (run.stage === 'analysis') {
      run.objection = candidateObjection(cand);
      if (cand.rsi >= 70) return failRun('analysis', 'BLOCK', `ANALYSIS → ${run.sym}: BLOCK — RSI ${cand.rsi.toFixed(0)} ≥ 70. Bear case: ${run.objection}`, run.sym);
      setChip('analysis', 'pass', 'APPROVE');
      setChip('strategy', 'working', 'PLANNING…');
      log('analysis', `ANALYSIS → ${run.sym}: APPROVE (RSI ${cand.rsi.toFixed(1)}, ${cand.playbookId} · regime ${cand.snapshot.regime.label} · alignment ${cand.snapshot.mtf.alignment}). Bear objection written to the ticket.`);
      run.stage = 'strategy'; run.t = 0;
    } else if (run.stage === 'strategy') {
      // Scenario Engine v1: standard 2,000-path batch on the exact levels.
      run.scenario = runScenario({ S, symbol: run.sym, decisionCandle: cand.signalCandle, entry: cand.entry, stop: cand.stop, target: cand.target });
      if (run.scenario.estimateState === 'COMPLETE') { D.scenarioBatches++; D.scenarioPaths += run.scenario.paths; }
      setChip('strategy', 'pass', 'GO');
      setChip('risk', 'working', 'SIZING…');
      const scenTxt = run.scenario.estimateState === 'COMPLETE'
        ? `Scenario: ${run.scenario.grade} — target first ${(run.scenario.targetFirstProbability * 100).toFixed(1)}% of ${run.scenario.paths.toLocaleString('en-US')} paths, expected ${run.scenario.expectedR >= 0 ? '+' : ''}${run.scenario.expectedR.toFixed(2)}R (advisory only — gate disabled).`
        : 'Scenario: INSUFFICIENT_DATA — no estimate fabricated.';
      log('strategy', `STRATEGY → ${run.sym}: GO — ${cand.playbookId} ${cand.playbookName} plan. Entry ${cand.entry.toFixed(2)} · stop ${cand.stop.toFixed(2)} · target ${cand.target.toFixed(2)} · R 1:${run.plan.rr.toFixed(1)}. ${scenTxt}`);
      run.stage = 'risk'; run.t = 0;
    } else if (run.stage === 'risk') {
      const sym = run.sym, plan = run.plan;
      if (D.stoppedDate === today()) return failRun('risk', 'REJECT', `RISK → ${sym}: REJECT — daily-loss brake is on. Chain dead.`, sym);
      if (stats.isBenched(cand.family, sym, cand.playbookId)) {
        const lane = stats.benchedLanes().map((b) => `${KIND_TXT[b.kind] || b.kind} ${b.label}`).join(' / ');
        return failRun('risk', 'BENCHED', `RISK → ${sym}: proposal SUPPRESSED — lane benched (${lane}). C-LO can reinstate from the performance panel.`, sym);
      }
      if (D.scenarioGateEnabled && run.scenario && run.scenario.estimateState === 'COMPLETE') {
        const belowT = D.scenarioMinTargetFirst !== null && run.scenario.targetFirstProbability < D.scenarioMinTargetFirst;
        const belowE = D.scenarioMinExpectedR !== null && run.scenario.expectedR < D.scenarioMinExpectedR;
        if (belowT || belowE) {
          return failRun('risk', 'SCENARIO GATE', `RISK → ${sym}: SCENARIO GATE — estimate below C-LO's minimums (target-first ${(run.scenario.targetFirstProbability * 100).toFixed(1)}%, expected ${run.scenario.expectedR.toFixed(2)}R). Chain dead.`, sym);
        }
      }
      const r = riskSize(plan, D.equity);
      // A-05: volatility percentile may only REDUCE the locked size, after caps.
      const volFactor = (cand.snapshot && cand.snapshot.volatility && cand.snapshot.volatility.riskFactor) || 1;
      let qty = r.qty, riskAmt = r.riskAmt;
      const reasons = [];
      if (r.reduced) reasons.push('size cut to 2.5% risk cap');
      if (volFactor < 1) { qty *= volFactor; riskAmt *= volFactor; reasons.push(`volatility factor ×${volFactor.toFixed(2)} (ATR percentile ${Math.round(cand.snapshot.volatility.percentile)})`); }
      setChip('risk', reasons.length ? 'warn' : 'pass', reasons.length ? 'REDUCE' : 'APPROVE');
      D.proposal = {
        id: D._nextId++, sym, side: 'LONG',
        entry: plan.entry, stop: plan.stop, target: plan.target, rr: plan.rr,
        qty, riskAmt, pattern: plan.pattern, family: cand.family,
        playbookId: cand.playbookId, playbookVersion: cand.playbookVersion, playbookName: cand.playbookName,
        underlyingPlaybookId: cand.underlyingPlaybookId,
        signalCandle: cand.signalCandle, candidateId: cand.candidateEventId,
        snapshot: cand.snapshot, patternGeometry: cand.patternGeometry, patternAge: cand.patternAge,
        scenario: run.scenario, objection: run.objection,
        objectionCodes: ((cand.snapshot && cand.snapshot.objections) || []).map((o) => o.code),
        evidence: cand.priority, riskFactor: volFactor, mode: D.mode,
        madeCandle: S.candleCount,
      };
      stats.updateCandidate(cand.candidateEventId, { outcome: 'proposal', proposalId: D.proposal.id });
      if (run.scenario && run.scenario.estimateState === 'COMPLETE') {
        stats.recordCalibration({
          proposalId: D.proposal.id, sym, playbookId: cand.playbookId, decisionCandle: cand.signalCandle,
          seed: run.scenario.seed, methodVersion: run.scenario.methodVersion,
          predictedTargetFirst: run.scenario.targetFirstProbability, expectedR: run.scenario.expectedR,
          grade: run.scenario.grade, outcome: null,
        });
      }
      D._run = null;
      log('risk', `RISK → ${sym}: ${reasons.length ? 'REDUCE — ' + reasons.join(' · ') : 'APPROVE'}. Ticket #${D.proposal.id} (${cand.playbookId}) to Execution (risk $${riskAmt.toFixed(2)}).`);
      emit('proposal', { proposal: D.proposal });
      routeProposal();
    }
  }

  // ---------- execution routing by mode ----------
  function fillProposal(autoTag) {
    const p = D.proposal, S = feed.series[p.sym];
    if (S.price <= p.stop || S.price >= p.target) {
      log('execution', `EXECUTION → ${p.sym}: ticket #${p.id} STALE — price already through a level. Ticket void, no fill.`);
      if (p.candidateId) stats.updateCandidate(p.candidateId, { outcome: 'stale' });
      D.proposal = null; setChip('execution', 'fail', 'STALE'); D._resetT = 2.4;
      return false;
    }
    D.position = {
      sym: p.sym, qty: p.qty, entry: S.price, ticketEntry: p.entry,
      stop: p.stop, target: p.target, pattern: p.pattern, family: p.family, openCandle: S.candleCount,
      playbookId: p.playbookId, playbookVersion: p.playbookVersion, playbookName: p.playbookName,
      underlyingPlaybookId: p.underlyingPlaybookId, proposalId: p.id, candidateId: p.candidateId,
      signalCandle: p.signalCandle, proposalCandle: p.madeCandle, fillCandle: S.candleCount,
      snapshot: p.snapshot, patternGeometry: p.patternGeometry, patternAge: p.patternAge,
      scenario: p.scenario, objection: p.objection, objectionCodes: p.objectionCodes,
      plannedRiskAmt: p.riskAmt, mode: p.mode, fillSource: autoTag || 'C-LO',
      mfeR: 0, maeR: 0,
    };
    if (p.candidateId) stats.updateCandidate(p.candidateId, { outcome: 'filled', fillCandle: S.candleCount });
    D.proposal = null; D.entriesToday++;
    setChip('execution', 'pass', 'FILLED');
    D._resetT = 2.4;
    log('execution', `EXECUTION → ${p.sym}: ${autoTag ? autoTag + ' ' : ''}FILLED LONG ${p.qty.toFixed(p.qty < 10 ? 4 : 2)} @ ${S.price.toFixed(2)} (SIM paper) — ${p.playbookId} ${p.playbookName}. Stop ${p.stop.toFixed(2)} · target ${p.target.toFixed(2)} — exits are automatic.`);
    emit('filled', { position: D.position });
    return true;
  }
  function routeProposal() {
    const p = D.proposal; if (!p) return;
    if (D.mode === 'auto') {
      log('execution', `EXECUTION → ${p.sym}: mode AUTO (paper) — Risk passed, filling without a click.`);
      fillProposal('AUTO');
    } else if (D.mode === 'leashed') {
      const rec = stats.laneRecord(p.family, p.sym);
      const proven = rec.n >= 8 && rec.pf >= 1.2 && !stats.isBenched(p.family, p.sym, p.playbookId);
      if (proven && D.entriesToday < D.leashCap) {
        log('execution', `EXECUTION → ${p.sym}: LEASHED — proven lane (${p.playbookId} ${p.playbookName} family on ${p.sym}: ${rec.n} trades, PF ${rec.pf.toFixed(2)}), entry ${D.entriesToday + 1}/${D.leashCap} today. Auto-filling (paper).`);
        fillProposal('LEASHED');
      } else {
        setChip('execution', 'wait', 'AWAITING C-LO');
        log('execution', `EXECUTION → ${p.sym}: LEASHED fallback — ${!proven ? 'lane not proven yet' : 'daily entry cap reached'}; ticket waits for C-LO's yes.`);
      }
    } else {
      setChip('execution', 'wait', 'AWAITING C-LO');
      log('execution', `EXECUTION → ${p.sym}: ticket #${p.id} is a PROPOSAL, not an order — waiting on C-LO's yes.`);
    }
  }
  D.setMode = (m) => {
    if (!MODES.includes(m) || m === D.mode) return;
    D.mode = m;
    log('execution', `EXECUTION → mode set to ${m.toUpperCase()}${m === 'approve' ? ' — C-LO\'s yes on every entry' : m === 'auto' ? ' — paper entries auto-fill after Risk' : ' — proven lanes auto-fill within the daily cap, the rest wait'}. Exits are automatic in every mode.`);
    emit('mode', { mode: m });
  };
  D.setLeashCap = (n) => { D.leashCap = Math.max(1, Math.min(25, n | 0)); };

  // ---------- position lifecycle ----------
  function recordClose(pos, price, reason, rehearsal) {
    const pnl = (price - pos.entry) * pos.qty;
    const risk = pos.qty * (pos.entry - pos.stop);
    const R = risk > 0 ? pnl / risk : 0;
    const t = {
      sym: pos.sym, family: pos.family || famKey(pos.pattern),
      playbookId: pos.playbookId || 'P-01', playbookVersion: pos.playbookVersion || '1.0',
      pnl, R, reason, rehearsal: !!rehearsal,
      side: 'LONG', triggerTimeframe: '1m',
      signalCandle: pos.signalCandle ?? null, proposalCandle: pos.proposalCandle ?? null,
      fillCandle: pos.fillCandle ?? pos.openCandle ?? null, exitCandle: pos.exitCandle ?? null,
      intendedEntry: pos.ticketEntry ?? pos.entry, fill: pos.entry,
      stop: pos.stop, target: pos.target, qty: pos.qty,
      plannedRisk: pos.plannedRiskAmt ?? risk,
      exitPrice: price,
      holdingCandles: (pos.exitCandle != null && (pos.fillCandle ?? pos.openCandle) != null)
        ? pos.exitCandle - (pos.fillCandle ?? pos.openCandle) : null,
      mfeR: pos.mfeR ?? null, maeR: pos.maeR ?? null,
      snapshot: pos.snapshot || null,
      patternGeometry: pos.patternGeometry || null, patternAge: pos.patternAge ?? null,
      scenario: pos.scenario && pos.scenario.estimateState === 'COMPLETE' ? {
        targetFirstProbability: pos.scenario.targetFirstProbability, expectedR: pos.scenario.expectedR,
        grade: pos.scenario.grade, seed: pos.scenario.seed, methodVersion: pos.scenario.methodVersion, paths: pos.scenario.paths,
      } : null,
      objectionCodes: pos.objectionCodes || [], objection: pos.objection || '',
      mode: pos.mode || D.mode, fillSource: pos.fillSource || '',
      candidateId: pos.candidateId ?? null, proposalId: pos.proposalId ?? null,
    };
    const newly = stats.record(t);
    if (pos.proposalId != null && pos.proposalId !== undefined) {
      const outcome = /^target/.test(reason) ? 'TARGET_FIRST' : /^stop/.test(reason) ? 'STOP_FIRST' : 'NON_DECISIVE';
      stats.resolveCalibration(pos.proposalId, outcome, R);
    }
    if (pos.candidateId) stats.updateCandidate(pos.candidateId, { tradeId: t.id, closed: true });
    return { pnl, R, newly };
  }
  function closePosition(price, reason) {
    const pos = D.position; if (!pos) return;
    pos.exitCandle = feed.series[pos.sym].candleCount;
    const { pnl, R, newly } = recordClose(pos, price, reason, false);
    D.equity += pnl;
    D.position = null;
    log('execution', `EXECUTION → ${pos.sym}: CLOSED @ ${price.toFixed(2)} (${reason}). P&L ${pnl >= 0 ? '+' : '−'}$${Math.abs(pnl).toFixed(2)} · ${R >= 0 ? '+' : ''}${R.toFixed(2)}R.`);
    setChip('growth', 'pass', 'REVIEWED');
    for (const b of newly) log('risk', `BENCHED: ${KIND_TXT[b.kind] || b.kind} ${b.label} — PF ${b.pf.toFixed(2)} over last ${b.n} closed trades (${b.bookMix.forward} forward / ${b.bookMix.rehearsal} rehearsal). Proposals suppressed until C-LO reinstates.`);
    log('growth', `GROWTH → review: ${pos.sym} ${pos.playbookId || 'P-01'} paid ${R >= 0 ? '+' : ''}${R.toFixed(2)}R. Forward book: ${stats.forward().wins}/${stats.forward().n} wins · PF ${fmtPF(stats.forward().pf)}.`);
    emit('closed', { sym: pos.sym, pnl, R });
    maybeScorecard();
    D._resetT = 2.4;
  }
  function fmtPF(pf) { return pf === Infinity ? '∞' : pf.toFixed(2); }
  D.closePosition = (reason) => { if (D.position) closePosition(feed.series[D.position.sym].price, reason || 'manual close by C-LO'); };
  D.approve = () => { if (!D.proposal) return false; log('execution', `EXECUTION → ${D.proposal.sym}: C-LO said YES on ticket #${D.proposal.id}.`); return fillProposal(''); };
  D.deny = () => {
    if (!D.proposal) return false;
    log('execution', `EXECUTION → ${D.proposal.sym}: ticket #${D.proposal.id} DENIED by C-LO. No order placed.`);
    if (D.proposal.candidateId) stats.updateCandidate(D.proposal.candidateId, { outcome: 'denied' });
    D.proposal = null; setChip('execution', 'fail', 'DENIED'); D._resetT = 2.4;
    return true;
  };
  D.proposalRecord = () => (D.proposal
    ? (D.proposal.playbookId ? stats.playbookSymbolRecord(D.proposal.playbookId, D.proposal.sym) : stats.laneRecord(D.proposal.pattern, D.proposal.sym))
    : null);
  D.reinstate = (key) => {
    const b = stats.benched.get(key);
    if (!b) return;
    stats.reinstate(key);
    log('risk', `RISK → lane REINSTATED by C-LO: ${KIND_TXT[b.kind] || b.kind} ${b.label} is back in rotation (probationary — its next 8 closes are labeled).`);
    emit('bench', {});
  };

  // ---------- growth scorecard ----------
  function maybeScorecard() {
    const mark = Math.floor(stats.all().n / 10);
    if (mark > (D._scoreMarks || 0)) { D._scoreMarks = mark; postScorecard('10-trade cycle'); }
  }
  function postScorecard(why) {
    const card = stats.scorecard();
    log('growth', `GROWTH → SCORECARD (${why}): forward P&L ${card.pnl >= 0 ? '+' : '−'}$${Math.abs(card.pnl).toFixed(2)} · expectancy ${card.expR >= 0 ? '+' : ''}${card.expR.toFixed(2)}R · best ${card.best} · worst ${card.worst} · benched: ${card.benched.join(', ') || 'none'}. Adjustment proposal: ${card.proposal}`);
    emit('scorecard', { card });
    return card;
  }
  D.postScorecard = () => postScorecard('on request');

  // ---------- rehearsal (frozen day, date hidden, tagged) ----------
  D.runRehearsal = () => {
    const fr = createFrozenSeries(150);
    const S = fr.series;
    let seed = 4242;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const drift = (i) => (i < 70 ? -0.0016 : i < 190 ? 0.0034 : i < 285 ? 0.0002 : -0.0013);
    let p = 150, pos = null, trades = 0, wins = 0, pnlSum = 0, suppressed = 0;
    log('growth', 'GROWTH → REHEARSAL started: frozen day, 390 candles, date hidden from the chain. Results tagged REHEARSAL — they never count toward the live gate.');
    for (let i = 0; i < 390; i++) {
      const o = p;
