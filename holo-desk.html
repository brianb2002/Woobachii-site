      for (let t = 0; t < 12; t++) p *= 1 + drift(i) / 12 + (rnd() - 0.5) * 0.0052;
      const c = { open: o, high: Math.max(o, p) * (1 + rnd() * 0.0018), low: Math.min(o, p) * (1 - rnd() * 0.0018), close: p, v: 1000 };
      fr.close(c);
      if (pos) {
        const rpu = pos.entry - pos.stop;
        if (rpu > 0) {
          pos.mfeR = Math.max(pos.mfeR || 0, (c.high - pos.entry) / rpu);
          pos.maeR = Math.min(pos.maeR || 0, (c.low - pos.entry) / rpu);
        }
        pos.exitCandle = S.candleCount;
        if (c.low <= pos.stop) { const r = recordClose(pos, pos.stop, 'stop 1.5×ATR', true); trades++; pnlSum += r.pnl; if (r.pnl >= 0) wins++; for (const b of r.newly) log('risk', `BENCHED (rehearsal): ${b.label} PF ${b.pf.toFixed(2)} over last ${b.n}.`); pos = null; }
        else if (c.high >= pos.target) { const r = recordClose(pos, pos.target, 'target 3×ATR', true); trades++; pnlSum += r.pnl; if (r.pnl >= 0) wins++; for (const b of r.newly) log('risk', `BENCHED (rehearsal): ${b.label} PF ${b.pf.toFixed(2)} over last ${b.n}.`); pos = null; }
        else if (crossDown(S)) { const r = recordClose(pos, c.close, 'EMA cross-down', true); trades++; pnlSum += r.pnl; if (r.pnl >= 0) wins++; pos = null; }
        continue;
      }
      if (scannerGate(S)) {
        const plan = strategyPlan(S);
        if (!plan) continue;
        const a = analysisGate(S, plan);
        if (!a.pass) continue;
        if (stats.isBenched('EMA', 'REPLAY', 'P-01')) { suppressed++; continue; }
        const r = riskSize(plan, stats.equityRehearsal());
        // Rehearsal stays the P-01 core, but its trades now carry the same
        // learning record: analyzer snapshot at signal time (cross-symbol
        // and daily fields are explicit INSUFFICIENT_DATA on a frozen day)
        // and a scenario attempt (also INSUFFICIENT_DATA under 1,000
        // returns — recorded as such, never fabricated).
        const snapshot = analyzerSnapshot({ series: { REPLAY: S } }, 'REPLAY', { playbookId: 'P-01', entry: plan.entry, stop: plan.stop, target: plan.target, patternAge: null });
        const scen = runScenario({ S, symbol: 'REPLAY', decisionCandle: S.candleCount, entry: plan.entry, stop: plan.stop, target: plan.target });
        pos = {
          sym: 'REPLAY', qty: r.qty, entry: c.close, ticketEntry: plan.entry, stop: plan.stop, target: plan.target,
          pattern: plan.pattern, family: 'EMA', openCandle: S.candleCount,
          playbookId: 'P-01', playbookVersion: '1.0', playbookName: 'EMA-CROSS TREND ENTRY',
          signalCandle: S.candleCount, fillCandle: S.candleCount,
          snapshot, patternGeometry: { crossSeparationATR: S.atr > 0 ? (S.e9 - S.e21) / S.atr : null },
          patternAge: null, scenario: scen, objection: a.objection,
          objectionCodes: (snapshot.objections || []).map((x) => x.code),
          plannedRiskAmt: r.riskAmt, mode: 'rehearsal', fillSource: 'REHEARSAL', mfeR: 0, maeR: 0,
        };
      }
    }
    if (pos) { pos.exitCandle = S.candleCount; const r = recordClose(pos, p, 'rehearsal day end', true); trades++; pnlSum += r.pnl; if (r.pnl >= 0) wins++; }
    log('growth', `GROWTH → REHEARSAL complete: ${trades} trades, ${wins} wins, P&L ${pnlSum >= 0 ? '+' : '−'}$${Math.abs(pnlSum).toFixed(2)} (rehearsal book)${suppressed ? ` · ${suppressed} candidate(s) suppressed by the bench` : ''}. Gate tracker untouched — forward trades only.`);
    emit('rehearsal', { trades, wins, pnl: pnlSum });
    maybeScorecard();
    return { trades, wins, pnl: pnlSum };
  };

  D.select = (sym) => { D.selected = sym; };

  // ---------- candle-close triggers (every symbol — Scanner rotates) ----------
  feed.onCandleClose = (sym, c) => {
    D.scanIdx = (D.scanIdx % SYMBOLS.length) + 1;
    D._closesSinceFind++;
    emit('candle', { sym });
    if (D.position && D.position.sym === sym && crossDown(feed.series[sym])) {
      closePosition(c.close, 'EMA cross-down');
      return;
    }
    if (D.proposal && D.proposal.sym === sym) {
      const S = feed.series[sym];
      if (S.candleCount > D.proposal.madeCandle + 6) {
        log('execution', `EXECUTION → ${sym}: ticket #${D.proposal.id} EXPIRED unacted (6 candles). No order placed.`);
        if (D.proposal.candidateId) stats.updateCandidate(D.proposal.candidateId, { outcome: 'expired' });
        D.proposal = null; setChip('execution', 'idle', 'EXPIRED'); D._resetT = 2.4;
      }
      return;
    }
    if (D.position || D.proposal || D._run || D.stoppedDate === today()) return;
    const S = feed.series[sym];
    if (stats.benched.has(`SYM:${sym}`)) return;   // benched symbol: Scanner passes over it
    intakeCandidates(sym);
    if (D._closesSinceFind >= 21) {
      D._closesSinceFind = 0;
      log('scanner', 'SCANNER → rotation complete: 7 symbols scanned, no qualifying triggers this pass. Continuing rotation.');
    }
  };

  // ---------- per-frame ----------
  D.update = (dt) => {
    const t = today();
    if (D.utcDate !== t) {
      D.utcDate = t; D.dayStartEquity = D.equity; D.entriesToday = 0;
      log('risk', 'RISK → new UTC day: daily-loss budget and entry count reset.');
    }
    // candidate priority: one pick per candle round, evidence first
    if (!D._run && !D.position && !D.proposal && D.candidateQueue.length && D.stoppedDate !== t) {
      startRun(pickCandidate());
    }
    if (D._run) { D._run.t += dt; if (D._run.t >= 0.45) advanceRun(); }
    if (D._resetT > 0) { D._resetT -= dt; if (D._resetT <= 0 && !D._run && !D.proposal) resetChain(); }
    if (D.position) {
      const S = feed.series[D.position.sym];
      const pos = D.position, rpu = pos.entry - pos.stop;
      if (rpu > 0) {
        const rNow = (S.price - pos.entry) / rpu;
        pos.mfeR = Math.max(pos.mfeR || 0, rNow);
        pos.maeR = Math.min(pos.maeR || 0, rNow);
      }
      if (S.price <= D.position.stop) closePosition(D.position.stop, 'stop 1.5×ATR');
      else if (S.price >= D.position.target) closePosition(D.position.target, 'target 3×ATR');
    }
    if (D.stoppedDate !== t && D.dayDD() >= 0.05) {
      D.stoppedDate = t;
      log('risk', 'RISK → STOP: daily loss ≥ 5% (SIM book). Chain halts proposals for the day' + (D.position ? ' — open position force-closed.' : '.'));
      if (D.proposal) {
        if (D.proposal.candidateId) stats.updateCandidate(D.proposal.candidateId, { outcome: 'void' });
        D.proposal = null; setChip('execution', 'fail', 'VOID');
      }
      if (D.position) closePosition(feed.series[D.position.sym].price, 'RISK STOP — 5% daily loss');
      setChip('risk', 'fail', 'STOPPED');
    }
  };

  log('execution', `Execution mode: ${D.mode.toUpperCase()} — C-LO's standing rule: his yes on every entry; exits automatic. Real money is not a mode on this page.`);
  log('scanner', 'HOLO DESK live (SIM). Six-bot chain autonomous — Scanner rotating AAPL · TSLA · NVDA · BTC · ETH · SPY · QQQ.');
  return D;
}

// ================= HOLO CHART CANVAS =================
// ============================================================ HOLO CHART CANVAS
// The 2D drawing that lives on the curved hologram screen (drawn to a
// 2048x768 canvas -> CanvasTexture). Webull/reference structure: symbol
// block top-left with O/H/L/C + Volume + EMA keys, timeframe tabs across
// the top, candles with three EMA lines, volume bars, right price axis
// with a last-price tag, high/low callouts, a faint dot world-map
// backdrop — plus the desk layer carried over from the machine's
// copilot: pattern marks (FVG / BOS / SWEEP) and the trade plan
// (entry / stop / target / R) drawn where the desk stamped them.
// The chart draws ONLY feed-computed state; it detects nothing itself.
// Redraws are event/cadence driven by main (never per frame).



const CHART_W = 2048, CHART_H = 768;
const TIMEFRAMES = ['1m', '5m', '15m', '1h', '1D', '1W', '1M'];
const TF_DEF = {
  '1m': { src: 'intra', f: 1, n: 84 }, '5m': { src: 'intra', f: 5, n: 84 },
  '15m': { src: 'intra', f: 15, n: 84 }, '1h': { src: 'intra', f: 60, n: 64 },
  '1D': { src: 'daily', f: 1, n: 96 }, '1W': { src: 'daily', f: 5, n: 64 },
  '1M': { src: 'daily', f: 21, n: 40 },
};
const UP = '#00E676', DN = '#FF3D57', CYAN = '#35C4FF', GOLD = '#FFD36B';

// coarse dot world map (backdrop flavour, as in the reference image)
const MAP = [
  '                                                                        ',
  '        ####   ##                                                       ',
  '     ######## #####        ###  ####  ##########                        ',
  '    ##########  ###       #########################  ##                 ',
  '     ########          ############################# ####   ##          ',
  '      ######            ##########################  ###########         ',
  '       ####              ########################    #########          ',
  '        ##    #           #####################       #######    #      ',
  '             ##            ##################          #####            ',
  '             ###            ################            ###             ',
  '             ####            ##############             ##              ',
  '              ###             ############                              ',
  '              ##               ##########              ####             ',
  '                               ########               ######            ',
  '                                ######                 ####             ',
  '                                 ####                   ##              ',
  '                                 ##                                     ',
];

const tabRects = []; // canvas-px rects from the last draw, for raycast taps
function tabAtUV(u, v) {
  const x = u * CHART_W, y = (1 - v) * CHART_H;
  for (const r of tabRects) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.tf;
  return null;
}

function emaSeries(closes, n) {
  const k = 2 / (n + 1); const out = new Array(closes.length);
  let e = closes[0];
  for (let i = 0; i < closes.length; i++) { e = i === 0 ? closes[0] : closes[i] * k + e * (1 - k); out[i] = e; }
  return out;
}

function createChart(canvas) {
  canvas.width = CHART_W; canvas.height = CHART_H;
  const g = canvas.getContext('2d');
  const layout = { win: 84, i0: 0 };

  // ---- shutter scanner state: a horizontal band flowing top -> bottom
  // across the WHOLE screen face on Scanner's ambient cadence (6 s per
  // sweep, continuous, independent of the vertical lock-on beam). The
  // counter is the real number of sweeps completed since first draw. ----
  const SHUTTER_MS = 6000;
  const shutter = { t0: null, count: 0, progress: 0, y: 0 };
  let lastScan = { text: 'Mapping candidate entry setups', done: 0 };
  function scanStatus(desk) {
    if (!desk) return { text: 'Mapping candidate entry setups', done: 0 };
    if (desk.position) return { text: 'Position live — exits armed at the levels', done: 5 };
    if (desk.proposal) return { text: 'Ranking results against your risk gates', done: 4 };
    if (desk._run) {
      if (desk._run.stage === 'analysis') return { text: 'Ranking results against your risk gates', done: 1 };
      if (desk._run.stage === 'strategy') return { text: 'Mapping candidate entry setups', done: 2 };
      return { text: 'Ranking results against your risk gates', done: 3 };
    }
    return { text: 'Mapping candidate entry setups', done: 0 };
  }

  function draw({ S, tf, desk, beam, now }) {
    // shutter clock (rAF timestamp from main; performance.now fallback)
    const tNow = typeof now === 'number' ? now : performance.now();
    if (shutter.t0 === null) shutter.t0 = tNow;
    const el = Math.max(0, tNow - shutter.t0);
    shutter.count = Math.floor(el / SHUTTER_MS);
    shutter.progress = (el % SHUTTER_MS) / SHUTTER_MS;
    shutter.y = shutter.progress * CHART_H;
    lastScan = scanStatus(desk);
    const meta = S.meta;
    const def = TF_DEF[tf];
    // ---- assemble displayed series ----
    let disp, liveDisp = null, srcIndex = null; // srcIndex: display idx -> source candle idx (intra only)
    if (def.src === 'intra') {
      const groups = resampleCandles(S.candles, def.f);
      disp = groups.slice();
      // forming candle: leftover source candles + live candle
      const used = groups.length * def.f;
      if (S.candles.length > used || true) {
        let o = null, h = -Infinity, l = Infinity, v = 0;
        for (let i = used; i < S.candles.length; i++) {
          const c = S.candles[i];
          if (o === null) o = c.open;
          h = Math.max(h, c.high); l = Math.min(l, c.low); v += c.v;
        }
        if (o === null) o = S.live.open;
        h = Math.max(h, S.live.high); l = Math.min(l, S.live.low); v += S.live.v;
        liveDisp = { open: o, high: h, low: l, close: S.live.close, v, n0: used };
        disp.push(liveDisp);
      }
      srcIndex = disp.map((c) => c.n0);
    } else {
      const groups = resampleCandles(S.daily.candles, def.f);
      disp = groups.slice();
      const used = groups.length * def.f;
      let o = null, h = -Infinity, l = Infinity, v = 0;
      for (let i = used; i < S.daily.candles.length; i++) {
        const c = S.daily.candles[i];
        if (o === null) o = c.open;
        h = Math.max(h, c.high); l = Math.min(l, c.low); v += c.v;
      }
      if (o === null) o = S.daily.live.open;
      h = Math.max(h, S.daily.live.high); l = Math.min(l, S.daily.live.low); v += S.daily.live.v;
      disp.push({ open: o, high: h, low: l, close: S.daily.live.close, v, n0: used });
    }
    const closes = disp.map((c) => c.close);
    const e9 = emaSeries(closes, 9), e21 = emaSeries(closes, 21), e50 = emaSeries(closes, 50);
    // Candles end mid-chart (C-LO's word, 2026-10-29): the window
    // shows ~62% of the timeframe's candles so the live edge rides at
    // ~62% across the plot and the right ~38% stays open as prediction
    // room; the window slides with the tape, so the chart follows.
    const win = Math.min(Math.round(def.n * 0.62), disp.length);
    const i0 = disp.length - win;
    layout.win = win; layout.i0 = i0;
    const vis = disp.slice(i0);

    // ---- background ----
    const bg = g.createLinearGradient(0, 0, 0, CHART_H);
    bg.addColorStop(0, 'rgba(10,34,66,0.97)'); bg.addColorStop(1, 'rgba(13,36,66,0.97)');
    g.fillStyle = bg; g.fillRect(0, 0, CHART_W, CHART_H);
    g.fillStyle = 'rgba(90,180,255,0.05)';
    for (let x = 24; x < CHART_W; x += 46) for (let y = 24; y < CHART_H; y += 46) { g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(110,200,255,0.10)';
    for (let r = 0; r < MAP.length; r++) for (let c = 0; c < MAP[r].length; c++) {
      if (MAP[r][c] !== '#') continue;
      g.beginPath(); g.arc((c + 0.5) / 72 * CHART_W, (r + 0.5) / MAP.length * CHART_H, 3.4, 0, 7); g.fill();
    }

    // ---- plot geometry ----
    const PX0 = 250, PX1 = 1904, PY0 = 158, PY1 = 624, VY1 = 680;
    let lo = Infinity, hi = -Infinity, vmax = 0;
    for (const c of vis) { lo = Math.min(lo, c.low); hi = Math.max(hi, c.high); vmax = Math.max(vmax, c.v); }
    const plan = desk && desk.position && desk.position.sym === meta.sym ? { ...desk.position, kind: 'OPEN' }
      : desk && desk.proposal && desk.proposal.sym === meta.sym ? { ...desk.proposal, kind: 'PROPOSAL' } : null;
    if (plan) { lo = Math.min(lo, plan.stop); hi = Math.max(hi, plan.target); }
    const pad = (hi - lo) * 0.09 || 1; lo -= pad; hi += pad;
    const CX1 = PX0 + (PX1 - PX0) * 0.62;   // candle field's right edge; PX1.. is prediction room
    const X = (i) => PX0 + (i + 0.5) * (CX1 - PX0) / win;
    const Y = (p) => PY0 + (hi - p) / (hi - lo) * (PY1 - PY0);
    const cw = Math.max(3, (CX1 - PX0) / win * 0.80);

    // grid + right axis
    g.font = '22px monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
    for (let i = 0; i <= 5; i++) {
      const p = lo + (hi - lo) * i / 5, y = Y(p);
      g.strokeStyle = 'rgba(90,180,255,0.12)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(PX0, y); g.lineTo(PX1, y); g.stroke();
      g.fillStyle = 'rgba(170,215,255,0.75)'; g.fillText(fmtPrice(p), PX1 + 14, y);
    }
    g.strokeStyle = 'rgba(90,180,255,0.10)';
    for (let i = 0; i < win; i += 7) { const x = X(i); g.beginPath(); g.moveTo(x, PY0); g.lineTo(x, PY1); g.stroke(); }

    // ---- prediction room (right of the live edge) ----
    // The empty field ahead of the candles: shaded violet, with the
    // EMA-drift ghost projection drawn into it — where price is
    // expected to go, before it gets there. Plan lines (below) span
    // the full width, so entries/stops/targets project here too.
    {
      g.fillStyle = 'rgba(138,134,255,0.05)'; g.fillRect(CX1, PY0, PX1 - CX1, PY1 - PY0);
      g.strokeStyle = 'rgba(138,134,255,0.45)'; g.lineWidth = 1.6; g.setLineDash([6, 6]);
      g.beginPath(); g.moveTo(CX1, PY0); g.lineTo(CX1, PY1); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(178,174,255,0.85)'; g.font = '700 20px monospace'; g.textAlign = 'left';
      g.fillText('PREDICTION →', CX1 + 14, PY0 + 24);
      const li = disp.length - 1, last = closes[li];
      const slope = (e9[li] - e9[Math.max(0, li - 8)]) / Math.min(8, li);
      let rng = 0; for (const c of vis) rng += c.high - c.low; rng = vis.length ? rng / vis.length : 0;
      const stepW = (CX1 - PX0) / win, steps = Math.floor((PX1 - CX1) / stepW);
      const proj = [], up = [], dn = [];
      for (let j = 0; j <= steps; j++) {
        const x = X(win - 1) + j * stepW, mid = last + slope * j, band = rng * (0.30 + 0.13 * j);
        proj.push([x, mid]); up.push([x, mid + band]); dn.push([x, mid - band]);
      }
      g.save(); g.beginPath(); g.rect(PX0, PY0, PX1 - PX0, PY1 - PY0); g.clip();
      g.beginPath();
      up.forEach(([x, p], k) => k ? g.lineTo(x, Y(p)) : g.moveTo(x, Y(p)));
      [...dn].reverse().forEach(([x, p]) => g.lineTo(x, Y(p)));
      g.closePath(); g.fillStyle = 'rgba(138,134,255,0.10)'; g.fill();
      g.beginPath();
      proj.forEach(([x, p], k) => k ? g.lineTo(x, Y(p)) : g.moveTo(x, Y(p)));
      g.strokeStyle = 'rgba(196,192,255,0.75)'; g.lineWidth = 2.2; g.setLineDash([9, 7]); g.stroke(); g.setLineDash([]);
      const [ex, ep] = proj[proj.length - 1];
      g.beginPath(); g.arc(ex, Y(ep), 5, 0, 7); g.fillStyle = 'rgba(196,192,255,0.9)'; g.fill();
      g.restore();
    }

    // ---- plan zones + lines (under candles) ----
    if (plan) {
      g.fillStyle = 'rgba(0,230,118,0.10)'; g.fillRect(PX0, Y(plan.target), PX1 - PX0, Y(plan.entry) - Y(plan.target));
      g.fillStyle = 'rgba(255,61,87,0.10)'; g.fillRect(PX0, Y(plan.entry), PX1 - PX0, Y(plan.stop) - Y(plan.entry));
      const line = (p, col, dash, label) => {
        g.strokeStyle = col; g.lineWidth = 2.4; g.setLineDash(dash);
        g.beginPath(); g.moveTo(PX0, Y(p)); g.lineTo(PX1, Y(p)); g.stroke(); g.setLineDash([]);
        g.fillStyle = col; g.font = '700 21px monospace';
        g.fillText(`${label} ${fmtPrice(p)}`, PX0 + 10, Y(p) - 16);
      };
      line(plan.entry, CYAN, [], 'ENTRY');
      line(plan.stop, DN, [10, 7], 'STOP');
      line(plan.target, UP, [10, 7], 'TARGET');
      g.fillStyle = GOLD; g.font = '700 24px monospace'; g.textAlign = 'right';
      g.fillText(`R 1 : ${plan.rr ? plan.rr.toFixed(1) : '2.0'}`, PX1 - 12, Y(plan.entry) - 18);
      g.textAlign = 'left';
    }

    // ---- pattern marks (intraday only — feed-stamped, drawn where they happened) ----
    if (def.src === 'intra') {
      for (const pe of S.patternHistory) {
        const srcIdx = pe.n - 1; // candle that stamped it
        const dIdx = Math.floor(srcIdx / def.f) - i0;
        if (dIdx < -2 || dIdx >= win) continue;
        const x = X(Math.max(0, Math.min(win - 1, dIdx)));
        g.font = '700 19px monospace';
        if (pe.family === 'FVG') {
          const gx0 = X(Math.max(0, dIdx - Math.ceil(2 / def.f))) - cw;
          const gx1 = X(Math.min(win - 1, dIdx + Math.ceil(4 / def.f))) + cw;
          g.fillStyle = 'rgba(127,219,255,0.16)'; g.fillRect(gx0, Y(pe.gapHi), gx1 - gx0, Y(pe.gapLo) - Y(pe.gapHi));
          g.strokeStyle = 'rgba(127,219,255,0.55)'; g.lineWidth = 1.4; g.strokeRect(gx0, Y(pe.gapHi), gx1 - gx0, Y(pe.gapLo) - Y(pe.gapHi));
          tag(x, Y(pe.gapHi) - 16, 'FVG', '#7FDBFF');
        } else if (pe.family === 'BOS') {
          g.strokeStyle = 'rgba(245,158,11,0.85)'; g.lineWidth = 2; g.setLineDash([12, 8]);
          g.beginPath(); g.moveTo(x, Y(pe.level)); g.lineTo(PX1, Y(pe.level)); g.stroke(); g.setLineDash([]);
          tag(x + 8, Y(pe.level) - 16, 'BOS', '#F59E0B');
        } else if (pe.family === 'LS') {
          const above = pe.extreme === 'high';
          const y = Y(pe.wick);
          g.fillStyle = '#A78BFA';
          g.beginPath();
          if (above) { g.moveTo(x, y - 4); g.lineTo(x - 9, y - 20); g.lineTo(x + 9, y - 20); }
          else { g.moveTo(x, y + 4); g.lineTo(x - 9, y + 20); g.lineTo(x + 9, y + 20); }
          g.closePath(); g.fill();
          tag(x, y + (above ? -34 : 34), 'SWEEP', '#A78BFA');
        }
      }
    }
    function tag(x, y, txt, col) {
      g.font = '700 19px monospace';
      const w = g.measureText(txt).width + 18;
      g.fillStyle = 'rgba(3,10,24,0.88)';
      g.beginPath(); g.roundRect(x - w / 2, y - 13, w, 26, 6); g.fill();
      g.strokeStyle = col; g.lineWidth = 1.4; g.stroke();
      g.fillStyle = col; g.textAlign = 'center'; g.fillText(txt, x, y + 1); g.textAlign = 'left';
    }

    // ---- candles + EMAs + volume ----
    const line2 = (arr, col, wdt) => {
      g.strokeStyle = col; g.lineWidth = wdt; g.beginPath();
      let started = false;
      for (let i = 0; i < win; i++) {
        const v = arr[i0 + i]; if (v === null || v === undefined) continue;
        const x = X(i), y = Y(v);
        if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
      }
      g.stroke();
    };
    for (let i = 0; i < win; i++) {
      const c = vis[i], x = X(i), up = c.close >= c.open;
      g.fillStyle = up ? 'rgba(0,230,118,0.75)' : 'rgba(255,61,87,0.75)';
      const vh = vmax ? (c.v / vmax) * (VY1 - PY1 - 8) : 0;
      g.fillRect(x - cw / 2, VY1 - vh, cw, vh);
    }
    g.lineWidth = 3;
    for (let i = 0; i < win; i++) {
      const c = vis[i], x = X(i), up = c.close >= c.open, col = up ? UP : DN;
      g.strokeStyle = col; g.fillStyle = col;
      g.beginPath(); g.moveTo(x, Y(c.high)); g.lineTo(x, Y(c.low)); g.stroke();
      const yO = Y(c.open), yC = Y(c.close);
      g.fillRect(x - cw / 2, Math.min(yO, yC), cw, Math.max(2.4, Math.abs(yC - yO)));
    }
    line2(e50, '#FF5D7A', 3); line2(e21, 'rgba(255,255,255,0.9)', 3); line2(e9, CYAN, 3.6);

    // high / low callouts (Webull layout)
    let hiI = 0, loI = 0;
    for (let i = 0; i < win; i++) { if (vis[i].high > vis[hiI].high) hiI = i; if (vis[i].low < vis[loI].low) loI = i; }
    g.fillStyle = '#35C4FF';
    g.beginPath(); g.arc(X(hiI), Y(vis[hiI].high), 4.5, 0, 7); g.fill();
    g.beginPath(); g.arc(X(loI), Y(vis[loI].low), 4.5, 0, 7); g.fill();
    g.font = '700 22px monospace'; g.fillStyle = 'rgba(210,235,255,0.95)';
    g.fillText(fmtPrice(vis[hiI].high), X(hiI) + 12, Y(vis[hiI].high) - 8);
    g.fillText(fmtPrice(vis[loI].low), X(loI) + 12, Y(vis[loI].low) + 10);

    // last price tag on the axis
    const last = S.price, chgDay = last - S.prevDayClose;
    const tagCol = chgDay >= 0 ? UP : DN, ly = Math.max(PY0 + 16, Math.min(PY1 - 16, Y(last)));
    g.fillStyle = tagCol; g.beginPath(); g.roundRect(PX1 + 6, ly - 17, 128, 34, 6); g.fill();
    g.fillStyle = '#03101F'; g.font = '700 23px monospace'; g.textAlign = 'center';
    g.fillText(fmtPrice(last), PX1 + 70, ly + 1); g.textAlign = 'left';

    // time axis
    g.font = '20px monospace'; g.fillStyle = 'rgba(170,215,255,0.7)';
    for (let i = 0; i < win; i += 14) {
      let label;
      if (def.src === 'intra') {
        const mins = 570 + ((vis[i].n0 || 0) % 390);
        label = `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
      } else {
        const d = new Date(Date.UTC(2026, 0, 1) + (vis[i].n0 || 0) * 86400000);
        label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      }
      g.fillText(label, X(i) - 24, VY1 + 30);
    }

    // ---- Scanner beam (visualises Scanner's real scan of this chart) ----
    if (beam && def.src === 'intra') {
      const bw = (PX1 - PX0) / win;
      if (beam.trail) for (let i = 0; i < win; i++) {
        const s = beam.trail[i];
        if (s > 0.02) { g.fillStyle = `rgba(53,196,255,${(0.16 * s).toFixed(3)})`; g.fillRect(X(i) - bw / 2, PY0, bw, PY1 - PY0); }
      }
      if (beam.mode === 'sweep') {
        const bx = PX0 + (beam.pos + 0.5) * bw;
        const grad = g.createLinearGradient(bx - bw * 1.6, 0, bx + bw * 1.6, 0);
        grad.addColorStop(0, 'rgba(53,196,255,0)'); grad.addColorStop(0.5, 'rgba(53,196,255,0.30)'); grad.addColorStop(1, 'rgba(53,196,255,0)');
        g.fillStyle = grad; g.fillRect(bx - bw * 1.6, PY0, bw * 3.2, PY1 - PY0);
        g.fillStyle = 'rgba(170,235,255,0.95)'; g.fillRect(bx - 1.5, PY0, 3, PY1 - PY0);
      } else { // 'lock' | 'block' — reticle on the last closed (trigger) candle
        const li = Math.max(0, Math.min(win - 1, (disp.length - 2) - i0));
        const c = vis[li], x = X(li);
        const col = beam.mode === 'block' ? `rgba(255,61,87,${(beam.strength ?? 1).toFixed(2)})` : '#35C4FF';
        const rx0 = x - cw * 1.15, rx1 = x + cw * 1.15, ry0 = Y(c.high) - 14, ry1 = Y(c.low) + 14, L = 17;
        g.strokeStyle = col; g.lineWidth = 3.4;
        g.beginPath();
        g.moveTo(rx0, ry0 + L); g.lineTo(rx0, ry0); g.lineTo(rx0 + L, ry0);
        g.moveTo(rx1 - L, ry0); g.lineTo(rx1, ry0); g.lineTo(rx1, ry0 + L);
        g.moveTo(rx1, ry1 - L); g.lineTo(rx1, ry1); g.lineTo(rx1 - L, ry1);
        g.moveTo(rx0 + L, ry1); g.lineTo(rx0, ry1); g.lineTo(rx0, ry1 - L);
        g.stroke();
        if (beam.mode === 'lock') tag(x, ry0 - 26, 'CANDIDATE', '#35C4FF');
      }
    }

    // ---- header block (Webull structure) ----
    const dayC = S.candles.slice(Math.floor((S.candleCount - 1) / 390) * 390);
    let dayVol = S.live.v; for (const c of dayC) dayVol += c.v;
    const pct = S.prevDayClose ? (chgDay / S.prevDayClose) * 100 : 0;
    g.fillStyle = '#FFFFFF'; g.font = '700 47px system-ui, sans-serif'; g.textBaseline = 'alphabetic';
    g.fillText(meta.sym, 46, 66);
    g.font = '400 24px system-ui, sans-serif'; g.fillStyle = 'rgba(190,225,255,0.8)';
    g.fillText(meta.name + ' · SIM', 46 + g.measureText('').width + (meta.sym.length * 30) + 26, 66);
    g.font = '800 88px system-ui, sans-serif'; g.fillStyle = '#FFFFFF';
    g.fillText(fmtPrice(last), 44, 158);
    g.font = '700 30px system-ui, sans-serif'; g.fillStyle = tagCol;
    g.fillText(`${chgDay >= 0 ? '▲' : '▼'} ${chgDay >= 0 ? '+' : '−'}${fmtPrice(Math.abs(chgDay))}  ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`, 46, 202);
    const rows = [
      ['O', fmtPrice(S.day.open), '#9FC6E8'], ['H', fmtPrice(Math.max(S.day.high, S.live.high)), '#9FC6E8'],
      ['L', fmtPrice(Math.min(S.day.low, S.live.low)), '#9FC6E8'], ['C', fmtPrice(last), '#9FC6E8'],
      ['Vol', fmtVol(dayVol), '#9FC6E8'],
      ['EMA 9', fmtPrice(e9[e9.length - 1]), CYAN],
      ['EMA 21', fmtPrice(e21[e21.length - 1]), '#FFFFFF'],
      ['EMA 50', fmtPrice(e50[e50.length - 1]), '#FF5D7A'],
    ];
    g.font = '22px monospace'; g.textBaseline = 'middle';
    rows.forEach(([k, v, col], i) => {
      const y = 246 + i * 35;
      g.fillStyle = col; g.fillText(k, 46, y);
      g.fillStyle = '#EAF6FF'; g.fillText(v, 118, y);
    });
    // plan status strip, bottom-left of the plot
    if (plan) {
      g.font = '700 23px monospace';
      g.fillStyle = plan.kind === 'OPEN' ? UP : GOLD;
      const txt = plan.kind === 'OPEN'
        ? `POSITION OPEN — LONG ${meta.sym} · stop ${fmtPrice(plan.stop)} · target ${fmtPrice(plan.target)}`
        : `PROPOSAL — LONG ${meta.sym} · awaiting C-LO (not an order)`;
      g.fillText(txt, PX0 + 6, VY1 + 30);
    }

    // ---- timeframe tabs ----
    tabRects.length = 0;
    const tw = 86, th = 46, gap = 10, total = TIMEFRAMES.length * tw + (TIMEFRAMES.length - 1) * gap;
    let tx = (CHART_W - total) / 2;
    g.font = '700 24px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const t of TIMEFRAMES) {
      const active = t === tf;
      g.fillStyle = active ? 'rgba(53,196,255,0.92)' : 'rgba(10,30,58,0.72)';
      g.beginPath(); g.roundRect(tx, 26, tw, th, 9); g.fill();
      if (!active) { g.strokeStyle = 'rgba(90,180,255,0.4)'; g.lineWidth = 1.4; g.stroke(); }
      g.fillStyle = active ? '#03101F' : 'rgba(200,232,255,0.9)';
      g.fillText(t, tx + tw / 2, 50);
      tabRects.push({ tf: t, x: tx, y: 26, w: tw, h: th });
      tx += tw + gap;
    }
    g.textAlign = 'left';

    // ---- scan status strip (etched on the screen's bottom edge) ----
    {
      const sy0 = 724;
      g.fillStyle = 'rgba(3,12,26,0.88)'; g.fillRect(14, sy0, CHART_W - 28, 36);
      g.fillStyle = 'rgba(53,196,255,0.5)'; g.fillRect(14, sy0, CHART_W - 28, 2);
      g.font = '700 22px monospace'; g.textBaseline = 'middle'; g.textAlign = 'left';
      g.fillStyle = CYAN;
      g.fillText('▸ ' + lastScan.text.toUpperCase(), 30, sy0 + 19);
      g.font = '400 20px monospace'; g.fillStyle = 'rgba(140,200,245,0.75)'; g.textAlign = 'center';
      g.fillText('● TREND STRUCTURE · ● MOMENTUM · ● VOLATILITY', CHART_W / 2 + 130, sy0 + 19);
      const pct = Math.round((lastScan.done / 6) * 100);
      const ptxt = `PIPELINE ${lastScan.done}/6 · ${pct}%`;
      g.font = '700 22px monospace'; g.fillStyle = '#EAF6FF'; g.textAlign = 'right';
      g.fillText(ptxt, CHART_W - 30, sy0 + 19);
      const pipX0 = CHART_W - 30 - g.measureText(ptxt).width - 18 - 6 * 24;
      for (let i = 0; i < 6; i++) {
        g.fillStyle = i < lastScan.done ? CYAN : 'rgba(70,170,255,0.22)';
        g.fillRect(pipX0 + i * 24, sy0 + 11, 17, 14);
      }
      g.textAlign = 'left';
    }

    // ---- shutter scanner (over the whole face; the beam stays separate) ----
    {
      const sy = shutter.y;
      const grd = g.createLinearGradient(0, sy - 170, 0, sy);
      grd.addColorStop(0, 'rgba(53,196,255,0)');
      grd.addColorStop(1, 'rgba(53,196,255,0.16)');
      g.fillStyle = grd;
      g.fillRect(0, Math.max(0, sy - 170), CHART_W, Math.min(170, sy));
      g.save();
      g.shadowColor = '#35C4FF'; g.shadowBlur = 18;
      g.fillStyle = 'rgba(190,240,255,0.95)';
      g.fillRect(0, sy - 1.5, CHART_W, 3);
      g.restore();
      const tagTxt = `STRUCTURE SCAN // ${String(shutter.count).padStart(3, '0')}`;
      g.font = '700 20px monospace'; g.textBaseline = 'middle'; g.textAlign = 'left';
      const twd = g.measureText(tagTxt).width + 24;
      const txx = CHART_W - twd - 26, tyy = Math.max(12, Math.min(CHART_H - 42, sy - 36));
      g.fillStyle = 'rgba(3,12,26,0.88)';
      g.beginPath(); g.roundRect(txx, tyy, twd, 30, 7); g.fill();
      g.strokeStyle = 'rgba(53,196,255,0.65)'; g.lineWidth = 1.4; g.stroke();
      g.fillStyle = CYAN; g.fillText(tagTxt, txx + 12, tyy + 16);
    }

    // ---- frame ----
    g.strokeStyle = 'rgba(80,190,255,0.55)'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(6, 6, CHART_W - 12, CHART_H - 12, 18); g.stroke();
    g.strokeStyle = 'rgba(80,190,255,0.18)'; g.lineWidth = 9;
    g.beginPath(); g.roundRect(12, 12, CHART_W - 24, CHART_H - 24, 14); g.stroke();
  }

  return {
    draw, layout,
    shutter: () => ({ count: shutter.count, progress: shutter.progress, y: shutter.y }),
    scanStatus: () => ({ ...lastScan }),
  };
}

// ================= 3D SCENE (the plate, screen, crew) =================
// ============================================================ HOLO DESK SCENE
// Three.js r160 scene for the holographic command display: a circular
// sci-fi platform with glowing rings and a segmented lit rim, an
// emitter arc, and a large curved hologram screen (concave backdrop,
// radius 30) carrying the chart CanvasTexture. The AI CREW figures
// that stood at consoles around the rim were removed 2026-10-28 at
// C-LO's word ("remove the bots"); the chain stations still report
// through the board's plaques, and the journal keeps the crew roster.

function mergeGeoms(THREE, list) {
  const pos = [], nor = [], uv = [];
  for (const g0 of list) {
    const g = g0.index ? g0.toNonIndexed() : g0;
    pos.push(...g.attributes.position.array);
    nor.push(...g.attributes.normal.array);
    if (g.attributes.uv) uv.push(...g.attributes.uv.array);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  if (uv.length) geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return geo;
}
function tGeo(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  if (rx) geo.rotateX(rx); if (ry) geo.rotateY(ry); if (rz) geo.rotateZ(rz);
  geo.translate(x, y, z);
  return geo;
}

// etched deck surface for the plate top: dark metal with a faint
// blueprint grid, concentric etch circles and radial spokes (drawn once)
function etchTexture(THREE) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const x = c.getContext('2d');
  if (x) {
    x.fillStyle = '#0a1424'; x.fillRect(0, 0, 1024, 1024);
    x.strokeStyle = 'rgba(90,180,255,0.07)'; x.lineWidth = 1;
    for (let i = 0; i <= 1024; i += 64) {
      x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 1024); x.stroke();
      x.beginPath(); x.moveTo(0, i); x.lineTo(1024, i); x.stroke();
    }
    x.strokeStyle = 'rgba(110,200,255,0.13)';
    for (const r of [70, 140, 215, 300, 385, 460]) {
      x.lineWidth = r % 3 === 0 ? 2 : 1.2;
      x.beginPath(); x.arc(512, 512, r, 0, Math.PI * 2); x.stroke();
    }
    x.strokeStyle = 'rgba(110,200,255,0.06)';
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      x.beginPath(); x.moveTo(512 + Math.cos(a) * 60, 512 + Math.sin(a) * 60);
      x.lineTo(512 + Math.cos(a) * 500, 512 + Math.sin(a) * 500); x.stroke();
    }
    // tick ring near the rim
    x.strokeStyle = 'rgba(140,220,255,0.35)';
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2, r0 = i % 6 === 0 ? 478 : 488;
      x.lineWidth = i % 6 === 0 ? 2.4 : 1.2;
      x.beginPath(); x.moveTo(512 + Math.cos(a) * r0, 512 + Math.sin(a) * r0);
      x.lineTo(512 + Math.cos(a) * 498, 512 + Math.sin(a) * 498); x.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function createScene(THREE, OrbitControls, renderer, chartCanvas) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030712);
  scene.fog = new THREE.FogExp2(0x030712, 0.0018);
  let vw = innerWidth, vh = innerHeight;
  if (renderer && renderer.getSize) { const s = renderer.getSize(new THREE.Vector2()); if (s.x > 0 && s.y > 0) { vw = s.x; vh = s.y; } }
  const camera = new THREE.PerspectiveCamera(46, vw / vh, 0.1, 600);
  camera.position.set(0, 15, 52);

  scene.add(new THREE.AmbientLight(0x88aaff, 0.55));
  const dir = new THREE.DirectionalLight(0x9fd0ff, 1.5);
  dir.position.set(30, 42, 26);
  scene.add(dir);
  const pt = new THREE.PointLight(0x3399ff, 1400, 0, 1.9);
  pt.position.set(0, 7, 0);
  scene.add(pt);

  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x111927, metalness: 0.72, roughness: 0.42 });
  const platMetal = new THREE.MeshStandardMaterial({ color: 0x0a1322, metalness: 0.8, roughness: 0.38 });
  const brass = new THREE.MeshStandardMaterial({ color: 0xB08D57, metalness: 0.9, roughness: 0.34 });

  // ---- floor: dark disc with a radial glow pool fading to black ----
  {
    const fc = document.createElement('canvas');
    fc.width = 256; fc.height = 256;
    const fx = fc.getContext('2d');
    if (fx) {
      const gr = fx.createRadialGradient(128, 128, 8, 128, 128, 128);
      gr.addColorStop(0, '#16395f'); gr.addColorStop(0.45, '#0e2542'); gr.addColorStop(1, '#020610');
      fx.fillStyle = gr; fx.fillRect(0, 0, 256, 256);
    }
    const ftex = new THREE.CanvasTexture(fc);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(120, 48), new THREE.MeshBasicMaterial({ map: ftex }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -0.02;
    scene.add(floor);
  }

  // ---- THE PLATE: a broad deck that fills the whole view ----
  const plat = new THREE.Group(); scene.add(plat);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(44, 46.2, 1.6, 96), platMetal);
  base.position.y = 0.8; plat.add(base);
  const etchMat = new THREE.MeshStandardMaterial({ map: etchTexture(THREE), metalness: 0.7, roughness: 0.46 });
  const topPlate = new THREE.Mesh(new THREE.CylinderGeometry(42.5, 42.5, 0.25, 96), etchMat);
  topPlate.position.y = 1.66; plat.add(topPlate);
  const hubBase = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.8, 0.55, 36), darkMetal);
  hubBase.position.y = 1.95; plat.add(hubBase);
  const ringMats = [];
  for (const [ri, ro, op] of [[3.9, 4.35, 0.95], [10.8, 11.3, 0.8], [17.8, 18.4, 0.8], [23.1, 23.85, 0.9], [30.3, 31.0, 0.7], [37.3, 38.1, 0.8]]) {
    const m = new THREE.MeshBasicMaterial({ color: 0x2ea8ff, transparent: true, opacity: op, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 96), m);
    ring.rotation.x = -Math.PI / 2; ring.position.y = 1.8;
    plat.add(ring); ringMats.push(m);
  }
  const rim = new THREE.Mesh(new THREE.TorusGeometry(44.2, 0.15, 8, 128), new THREE.MeshBasicMaterial({ color: 0x57c8ff }));
  rim.rotation.x = Math.PI / 2; rim.position.y = 1.45; plat.add(rim);
  { // segmented rim light blocks (instanced, varied brightness)
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1.7, 0.34, 0.55), new THREE.MeshBasicMaterial({ color: 0xffffff }), 64);
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), V = new THREE.Vector3(), Sv = new THREE.Vector3(1, 1, 1);
    const col = new THREE.Color();
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      E.set(0, -a, 0); Q.setFromEuler(E);
      V.set(Math.sin(a) * 44.7, 1.12, Math.cos(a) * 44.7);
      M.compose(V, Q, Sv); inst.setMatrixAt(i, M);
      const b = i % 5 === 0 ? 0.35 : 0.75 + (i % 3) * 0.12;
      inst.setColorAt(i, col.setRGB(0.2 * b, 0.62 * b, b));
    }
    plat.add(inst);
  }

  // ---- hologram screen (concave backdrop: far side of a cylinder) ----
  // Screen enlarged twice at C-LO's word: height 17 -> 23 (2026-10-28
  // evening), then 23 -> 29 with wrap 2.24 -> 2.48 rad (2026-10-29,
  // "make the chart 5x bigger" — the glass takes over the desk; base
  // stays at y 4.9, top rises to 33.9).
  const ARC = 2.48, SCR_R = 30, SCR_C = new THREE.Vector3(0, 19.4, 10);
  const SCR_H = 29;
  const scrGroup = new THREE.Group(); scene.add(scrGroup);
  const chartTex = new THREE.CanvasTexture(chartCanvas);
  chartTex.colorSpace = THREE.SRGBColorSpace;
  chartTex.wrapS = THREE.RepeatWrapping; chartTex.repeat.x = -1; // viewed from inside: un-mirror
  chartTex.anisotropy = 8;
  const scrGeo = new THREE.CylinderGeometry(SCR_R, SCR_R, SCR_H, 64, 1, true, Math.PI - ARC / 2, ARC);
  const screenMat = new THREE.MeshBasicMaterial({ map: chartTex, transparent: true, opacity: 0.97, side: THREE.DoubleSide, depthWrite: false });
  const screen = new THREE.Mesh(scrGeo, screenMat);
  screen.position.copy(SCR_C); screen.renderOrder = 3;
  scrGroup.add(screen);
  const backing = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R + 0.5, SCR_R + 0.5, SCR_H + 0.4, 64, 1, true, Math.PI - ARC / 2, ARC),
    new THREE.MeshBasicMaterial({ color: 0x1b4d7a, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false }));
  backing.position.copy(SCR_C); backing.renderOrder = 2;
  scrGroup.add(backing);
  // ---- thick holographic slab (C-LO's word, 2026-10-29, restated
  // twice: "make the hologram THICKER") ----
  // The hologram is a deep slab of light, 3.4 units thick: a deep-blue
  // back shell, TWO ghost echoes of the chart glowing inside the slab,
  // solid translucent end walls (the slab's side faces), fat glowing
  // rails up both ends, and a faint front echo toward the viewer.
  const SLAB = 3.4;
  const slabShell = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R + SLAB, SCR_R + SLAB, SCR_H + 0.4, 64, 1, true, Math.PI - ARC / 2, ARC),
    new THREE.MeshBasicMaterial({ color: 0x0a2f52, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));
  slabShell.position.copy(SCR_C); slabShell.renderOrder = 1;
  scrGroup.add(slabShell);
  const ghostMat = new THREE.MeshBasicMaterial({ map: chartTex, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
  const ghost = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R + 1.1, SCR_R + 1.1, SCR_H, 64, 1, true, Math.PI - ARC / 2, ARC), ghostMat);
  ghost.position.copy(SCR_C); ghost.renderOrder = 2;
  scrGroup.add(ghost);
  const ghost2 = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R + 2.2, SCR_R + 2.2, SCR_H, 64, 1, true, Math.PI - ARC / 2, ARC),
    new THREE.MeshBasicMaterial({ map: chartTex, transparent: true, opacity: 0.09, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  ghost2.position.copy(SCR_C); ghost2.renderOrder = 2;
  scrGroup.add(ghost2);
  const frontEcho = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R - 0.9, SCR_R - 0.9, SCR_H, 64, 1, true, Math.PI - ARC / 2, ARC),
    new THREE.MeshBasicMaterial({ map: chartTex, transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  frontEcho.position.copy(SCR_C); frontEcho.renderOrder = 4;
  scrGroup.add(frontEcho);
  for (const sgn of [-1, 1]) { // slab end walls + fat glowing rails
    const th = Math.PI + sgn * ARC / 2;
    const wall = new THREE.Mesh(new THREE.BoxGeometry(SLAB, SCR_H, 0.3),
      new THREE.MeshBasicMaterial({ color: 0x2e7cc4, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false }));
    wall.position.set(Math.sin(th) * (SCR_R + SLAB / 2), SCR_C.y, SCR_C.z + Math.cos(th) * (SCR_R + SLAB / 2));
    wall.rotation.y = Math.atan2(-Math.cos(th), Math.sin(th));
    wall.renderOrder = 2;
    scrGroup.add(wall);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(1.3, SCR_H + 0.6, 1.3),
      new THREE.MeshBasicMaterial({ color: 0x57c8ff }));
    rail.position.set(Math.sin(th) * (SCR_R + SLAB / 2), SCR_C.y, SCR_C.z + Math.cos(th) * (SCR_R + SLAB / 2));
    rail.rotation.y = -sgn * ARC / 2;
    rail.renderOrder = 3;
    scrGroup.add(rail);
  }
  // refresh sweep: a soft light band that travels the glass
  const sweepMat = new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
  const sweep = new THREE.Mesh(
    new THREE.CylinderGeometry(SCR_R - 0.6, SCR_R - 0.6, SCR_H, 24, 1, true, Math.PI - 0.19, 0.38), sweepMat);
  sweep.position.copy(SCR_C); sweep.renderOrder = 4;
  scrGroup.add(sweep);
  for (const yy of [SCR_C.y - SCR_H / 2 - 0.05, SCR_C.y + SCR_H / 2 + 0.05]) { // glow bands top/bottom, front + back shell (slab edges)
    for (const rr of [SCR_R + 0.06, SCR_R + SLAB]) {
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(rr, rr, 0.55, 64, 1, true, Math.PI - ARC / 2, ARC),
        new THREE.MeshBasicMaterial({ color: 0x57c8ff, transparent: true, opacity: 0.95, side: THREE.DoubleSide }));
      band.position.set(SCR_C.x, yy, SCR_C.z);
      scrGroup.add(band);
    }
  }
  // projection light curtain between emitter arc and screen base
  const curtainMat = new THREE.MeshBasicMaterial({ color: 0x2ea8ff, transparent: true, opacity: 0.11, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
  const curtain = new THREE.Mesh(new THREE.CylinderGeometry(SCR_R, SCR_R, 1.9, 64, 1, true, Math.PI - ARC / 2, ARC), curtainMat);
  curtain.position.set(SCR_C.x, 3.9, SCR_C.z); curtain.renderOrder = 1;
  scrGroup.add(curtain);

  // ---- atmosphere: a broad radial glow behind the screen, so the sky
  // itself reads holographic (the reference frame is drenched in it) ----
  {
    const gc = document.createElement('canvas');
    gc.width = 256; gc.height = 256;
    const gx = gc.getContext('2d');
    if (gx) {
      const gr = gx.createRadialGradient(128, 128, 8, 128, 128, 128);
      gr.addColorStop(0, 'rgba(46,120,205,0.72)'); gr.addColorStop(0.55, 'rgba(28,80,150,0.34)'); gr.addColorStop(1, 'rgba(10,30,70,0)');
      gx.fillStyle = gr; gx.fillRect(0, 0, 256, 256);
    }
    const gtex = new THREE.CanvasTexture(gc);
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(200, 115),
      new THREE.MeshBasicMaterial({ map: gtex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.position.set(0, 18, -42);
    scene.add(glow);
  }

  // ---- emitter arc: pillars + glowing tips along the screen's base arc ----
  {
    const pilGeo = new THREE.BoxGeometry(0.72, 1.5, 0.72);
    const tipGeo = new THREE.BoxGeometry(0.5, 0.3, 0.5);
    const pil = new THREE.InstancedMesh(pilGeo, darkMetal, 9);
    const tip = new THREE.InstancedMesh(tipGeo, new THREE.MeshBasicMaterial({ color: 0x7FDBFF }), 9);
    const M = new THREE.Matrix4();
    for (let k = 0; k < 9; k++) {
      const th = Math.PI + (k / 8 - 0.5) * ARC * 0.92;
      const x = Math.sin(th) * SCR_R * 0.93, z = SCR_C.z + Math.cos(th) * SCR_R * 0.93;
      M.makeTranslation(x, 2.35, z); pil.setMatrixAt(k, M);
      M.makeTranslation(x, 3.25, z); tip.setMatrixAt(k, M);
    }
    scene.add(pil); scene.add(tip);
  }

  // ---- the AI crew: REMOVED 2026-10-28 at C-LO's word ("remove the
  // bots"). The figures are gone from the plate; the crew API remains
  // as a no-op so the desk's event wiring in main.js needs no changes.
  const crew = { figures: {}, list: [], burst() {}, setWork() {} };

  // ---- ambient particles ----
  let particles;
  {
    const n = 240, posArr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, r = 32 + Math.random() * 42;
      posArr[i * 3] = Math.cos(a) * r; posArr[i * 3 + 1] = Math.random() * 26; posArr[i * 3 + 2] = Math.sin(a) * r;
    }
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    particles = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x4db8ff, size: 0.34, transparent: true, opacity: 0.5 }));
    particles.name = 'ambient-motes';
    scene.add(particles);
  }

  // ---- ambient fill: one big slow orbital ring + arcs behind-above the
  // screen, so the air itself reads holographic. Ambient budget: ring (1)
  // + arcs (1) + motes (1) = 3 draws. ----
  const ambGroup = new THREE.Group();
  ambGroup.position.set(0, 26.5, -27);
  ambGroup.rotation.x = 1.02;
  scene.add(ambGroup);
  const ambRing = new THREE.Mesh(
    new THREE.TorusGeometry(27, 0.09, 8, 180),
    new THREE.MeshBasicMaterial({ color: 0x2ea8ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
  ambRing.name = 'ambient-ring';
  ambRing.scale.set(1, 0.85, 1);
  ambGroup.add(ambRing);
  let ambArcs;
  {
    const seg = [];
    const arc = (r, a0, a1, n) => {
      let prev = null;
      for (let i = 0; i <= n; i++) {
        const a = a0 + ((a1 - a0) * i) / n;
        const p = [Math.cos(a) * r, Math.sin(a) * r, 0];
        if (prev) seg.push(...prev, ...p);
        prev = p;
      }
    };
    arc(22.5, 0.4, 2.5, 36); arc(30.5, 2.9, 5.3, 42); arc(34.5, 5.6, 6.9, 24);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
    ambArcs = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x57c8ff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    ambArcs.name = 'ambient-arcs';
    ambGroup.add(ambArcs);
  }
  const ambient = { ring: ambRing, arcs: ambArcs, motes: particles, draws: 3 };

  // ---- camera + controls + flights ----
  // Framing is aspect-aware: the fit keeps the screen, plaques, tiles and
  // dial inside the frame at any viewport. Portrait phones raise the FOV
  // and pull the camera back until the whole plate arrangement fits.
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  // FRONT sits BELOW its target (monument angle: polar ~1.62 rad from
  // +Y). The polar clamp must allow that, or the first controls.update()
  // flips the camera above the desk and the load view becomes the
  // top-down island C-LO photographed on 2026-10-28.
  controls.minPolarAngle = 0.12; controls.maxPolarAngle = 1.74;
  controls.minDistance = 14; controls.maxDistance = 280;
  controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.7;
  const VIEWS = {
    // FRONT is the load view, framed like C-LO's reference: camera
    // slightly BELOW the screen's mid-height, looking slightly UP at
    // the hologram (monument angle) — never a top-down island.
    FRONT: { d: [0, -0.03, 1],   t: [0, 17, -2], s: 1 },
    ISO:   { d: [0.60, 0.42, 0.68], t: [0, 16, -2], s: 1 },
    TOP:   { d: [0, 1, 0.22],     t: [0, 2, -2],  s: 1.12 },
    SIDE:  { d: [1, 0.05, 0.12],  t: [0, 16.5, -2], s: 1 },
  };
  const FIT_HW = 33, FIT_HH = 27;   // fallback half-extents (pre-board framing)
  const FIT_MARGIN = 0.985;           // anchor fit: composition spans ~98.5% max
  let curView = 'FRONT', userMoved = false;
  let fitPts = [];
  function fitFov() {
    const a = camera.aspect;
    if (a >= 1.05) return 46;
    if (a <= 0.6) return 68;
    return 46 + ((1.05 - a) / 0.45) * 22;
  }
  // worst |NDC| over the anchor set if the camera sat at distance d
  // along direction dir from target tgt (fitToFrame's core measure)
  const _cam = new THREE.Vector3(), _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(),
    _up = new THREE.Vector3(), _rel = new THREE.Vector3(), UP0 = new THREE.Vector3(0, 1, 0);
  function ndcExtentAt(d, dir, tgt) {
    _cam.copy(tgt).addScaledVector(dir, d);
    _fwd.copy(dir).negate();
    _rgt.crossVectors(_fwd, UP0).normalize();
    _up.crossVectors(_rgt, _fwd);
    const tV = Math.tan((camera.fov * Math.PI / 180) / 2), tH = tV * camera.aspect;
    let m = 0;
    for (const p of fitPts) {
      _rel.set(p[0] - _cam.x, p[1] - _cam.y, p[2] - _cam.z);
      const zc = _rel.dot(_fwd);
      if (zc < 1) return Infinity;
      m = Math.max(m, Math.abs(_rel.dot(_rgt)) / (zc * tH), Math.abs(_rel.dot(_up)) / (zc * tV));
    }
    return m;
  }
  function fitDistDir(dir, tgt) {
    let lo = 10, hi = 340;
    for (let i = 0; i < 30; i++) {
      const mid = (lo + hi) / 2;
      if (ndcExtentAt(mid, dir, tgt) > FIT_MARGIN) lo = mid; else hi = mid;
    }
    if (ndcExtentAt(hi, dir, tgt) > 1.0) hi *= 1.25;
    return hi;
  }
  function fitDistFor(v) {
    if (!fitPts.length) {
      const tV = Math.tan((camera.fov * Math.PI / 180) / 2);
      return (Math.max(FIT_HH / tV, FIT_HW / (tV * camera.aspect)) + 3) * v.s;
    }
    return fitDistDir(new THREE.Vector3(...v.d).normalize(), new THREE.Vector3(...v.t)) * v.s;
  }
  // fitToFrame: derive the camera distance from the desk's anchor
  // bounding set + current FOV/aspect so the composition fills the
  // frame with only the FIT_MARGIN border, at any viewport.
  function fitToFrame() {
    if (flight || userMoved) return;
    const vp = viewPos(curView);
    camera.position.copy(vp.p);
    controls.target.copy(vp.t);
    // a pinch can never strand the desk tiny and far away: zoom-out is
    // capped just past the fitted distance for this viewport
    controls.maxDistance = Math.max(60, vp.p.distanceTo(vp.t) * 1.4);
  }
  // resize path when the user has orbited: keep THEIR angle and target,
  // adjust only the distance so the fit survives orientation changes
  // and mobile browser chrome settling — the framing can never be
  // stranded the way a fixed distance can.
  function refitKeepAngle() {
    if (!fitPts.length) return;
    const tgt = controls.target.clone();
    const dir = camera.position.clone().sub(tgt);
    if (dir.lengthSq() < 1e-6) return;
    dir.normalize();
    camera.position.copy(tgt).addScaledVector(dir, fitDistDir(dir, tgt));
  }
  function setFitPoints(pts) { fitPts = pts || []; }
  // points on the hologram screen's surface (cylinder param eq) — the
  // screen's own anchors for framing + the layout test's screen box
  function screenAnchors() {
    const pts = [];
    for (const th of [Math.PI - ARC / 2, Math.PI - ARC / 4, Math.PI, Math.PI + ARC / 4, Math.PI + ARC / 2])
      for (const y of [4.9, SCR_C.y, 4.9 + SCR_H])
        pts.push([Math.sin(th) * SCR_R, y, SCR_C.z + Math.cos(th) * SCR_R]);
    return pts;
  }
  function viewPos(name) {
    const v = VIEWS[name];
    const dir = new THREE.Vector3(...v.d).normalize();
    const tgt = new THREE.Vector3(...v.t);
    return { p: tgt.clone().addScaledVector(dir, fitDistFor(v)), t: tgt };
  }
  function applyFraming() {
    camera.fov = fitFov();
    camera.updateProjectionMatrix();
  }
  function setViewport(w, h) {
    if (!(w > 0 && h > 0)) return;
    camera.aspect = w / h;
    applyFraming();
    if (flight) return;
    if (!userMoved) fitToFrame();
    else refitKeepAngle();
  }
  {
    applyFraming();
    const vp = viewPos('FRONT');
    camera.position.copy(vp.p);
    controls.target.copy(vp.t);
  }
  let flight = null, lastInteract = -10, elapsed = 0;
  // NOTE: 'start' fires for plain taps too, and a tap must not hand
  // framing to the user — main.js calls markUserMoved() only after a
  // real drag (pointer travel) or a wheel/pinch zoom.
  controls.addEventListener('start', () => { flight = null; lastInteract = elapsed; });
  function markUserMoved() { userMoved = true; }
  controls.addEventListener('end', () => { lastInteract = elapsed; });
  function flyTo(name) {
    const v = VIEWS[name]; if (!v) return;
    curView = name;
    const vp = viewPos(name);
    flight = {
      t: 0, dur: 1.5,
      p0: camera.position.clone(), p1: vp.p,
      c0: controls.target.clone(), c1: vp.t,
    };
  }

  function update(dt) {
    elapsed += dt;
    if (flight) {
      flight.t += dt / flight.dur;
      const k = flight.t >= 1 ? 1 : (1 - Math.pow(1 - flight.t, 3));
      camera.position.lerpVectors(flight.p0, flight.p1, k);
      controls.target.lerpVectors(flight.c0, flight.c1, k);
      if (flight.t >= 1) flight = null;
    }
    controls.autoRotate = !flight && (elapsed - lastInteract > 12);
    controls.autoRotateSpeed = 0.12;
    controls.update();
    const t = elapsed;
    ringMats.forEach((m, i) => { m.opacity = 0.72 + 0.26 * Math.sin(t * 2 + i * 1.3); });
    curtainMat.opacity = 0.10 + 0.04 * Math.sin(t * 1.7);
    scrGroup.position.y = Math.sin(t * 0.8) * 0.12;
    screenMat.opacity = 0.95 + 0.04 * Math.sin(t * 7.3) * Math.sin(t * 1.31);
    ghostMat.opacity = 0.13 + 0.05 * Math.sin(t * 2.3);
    const sweepPhase = (t % 8) / 8;
    sweep.rotation.y = (sweepPhase - 0.5) * (ARC + 0.8);
    sweepMat.opacity = 0.09 * Math.sin(Math.PI * sweepPhase);
    particles.rotation.y += dt * 0.008;
    ambRing.rotation.z += dt * 0.045;
    ambArcs.rotation.z -= dt * 0.028;
  }

  function counts() {
    let main = 0, tris = 0;
    scene.traverse((o) => {
      if ((o.isMesh || o.isPoints) && o.visible) {
        main += 1; // one draw call per renderable (InstancedMesh included)
        const g = o.geometry;
        const t = (g.index ? g.index.count : g.attributes.position.count) / 3;
        tris += t * (o.isInstancedMesh ? o.count : 1);
      }
    });
    return { main, shadow: 0, combined: main, tris: Math.round(tris) };
  }

  return {
    scene, camera, controls, crew, screen, chartTex, flyTo, update, counts, VIEWS, setViewport, plate: plat,
    ambient, setFitPoints, screenAnchors, fitToFrame, markUserMoved,
    screenBox() {
      const corners = screenAnchors();
      const c = [0, 0, 0];
      for (const p of corners) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }
      return { center: [c[0] / corners.length, c[1] / corners.length, c[2] / corners.length], corners };
    },
  };
}

// ================= HOLO BOARD (in-scene controls + pop-ups) =================
// ============================================================ HOLO BOARD
// Every control lives IN the scene now — C-LO's call (2026-10-28):
// "make the plate for the whole screen and all the buttons are
// holographic pop ups or already a part of the board." The DOM
// dashboard is gone. On the plate: watchlist tiles, the six chain
// plaques, the execution-mode dial, the readout strip, board buttons
// and camera buttons — all canvas-texture holo panels, tappable by
// raycast. Floating pop-ups (proposal / position / performance /
// journal) summon and dismiss in the air in front of the screen.
// This module is presentation only: it reads desk/feed state and
// routes taps to the handlers main gives it. It computes nothing
// about the market.

function createBoard(THREE, scene, handlers, env) {
  const { SYMBOLS, BOTS, fmtPrice, fmtMoney, fmtSigned, patternName } = env;
  const CYAN = '#35C4FF', GOLD = '#FFD36B', UP = '#00E676', DN = '#FF3D57',
    WHITE = '#EAF6FF', DIM = '#7D99B5', PANEL = 'rgba(4,16,32,0.90)';

  const root = new THREE.Group();
  scene.add(root);
  let desk = null, feed = null, entries = [];
  let aspect = 16 / 9, elapsed = 0, portrait = false;

  // ---------- panel factory ----------
  const allPanels = [];
  function makePanel(w, h, cw, ch, order = 6) {
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
    mesh.renderOrder = order;
    const P = {
      w, h, cw, ch, canvas, ctx, tex, mesh,
      group: new THREE.Group(), regions: [], fullAction: null, sig: '',
      anchor: null, phase: Math.random() * 6.28, isPopup: false, backMat: null,
    };
    P.group.add(mesh);
    P.hit = (uv) => {
      const px = uv.x * cw, py = (1 - uv.y) * ch;
      for (const r of P.regions) if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r.id;
      return P.fullAction;
    };
    P.pointFor = (id) => {
      const r = P.regions.find((q) => q.id === id) || (P.fullAction === id ? { x: 0, y: 0, w: cw, h: ch } : null);
      if (!r) return null;
      mesh.updateWorldMatrix(true, false);
      return mesh.localToWorld(new THREE.Vector3(
        ((r.x + r.w / 2) / cw - 0.5) * w, (0.5 - (r.y + r.h / 2) / ch) * h, 0.05));
    };
    allPanels.push(P);
    return P;
  }
  function makePopup(w, h, cw, ch) {
    const P = makePanel(w, h, cw, ch, 10);
    const back = new THREE.Mesh(
      new THREE.PlaneGeometry(w * 1.045, h * 1.045),
      new THREE.MeshBasicMaterial({ color: 0x1c6fb8, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    back.position.z = -0.06; back.renderOrder = 9;
    P.group.add(back); P.backMat = back.material;
    P.isPopup = true;
    P.group.visible = false;
    root.add(P.group);
    return P;
  }

  // ---------- canvas helpers ----------
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function frame(P, accent = 'rgba(70,170,255,0.85)') {
    const { ctx, cw, ch } = P;
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = PANEL; rr(ctx, 3, 3, cw - 6, ch - 6, 18); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 3; rr(ctx, 3, 3, cw - 6, ch - 6, 18); ctx.stroke();
    ctx.strokeStyle = 'rgba(127,219,255,0.5)'; ctx.lineWidth = 5;
    const L = 26;
    for (const [x, y, dx, dy] of [[10, 10, 1, 1], [cw - 10, 10, -1, 1], [10, ch - 10, 1, -1], [cw - 10, ch - 10, -1, -1]]) {
      ctx.beginPath(); ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); ctx.stroke();
    }
  }
  function text(P, s, x, y, size, color, align = 'left', weight = 700) {
    const { ctx } = P;
    ctx.font = `${weight} ${size}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.textAlign = 'left';
  }
  function wrap(P, s, x, y, maxW, lh, maxLines, size, color, weight = 400) {
    const { ctx } = P;
    ctx.font = `${weight} ${size}px ui-monospace, Menlo, monospace`;
    const words = String(s).split(/\s+/);
    let line = '', yy = y, n = 0;
    for (const wd of words) {
      const t = line ? line + ' ' + wd : wd;
      if (ctx.measureText(t).width > maxW && line) {
        ctx.fillStyle = color; ctx.fillText(n === maxLines - 1 ? line + '…' : line, x, yy);
        n++; yy += lh; line = wd;
        if (n >= maxLines) return yy;
      } else line = t;
    }
    if (line && n < maxLines) { ctx.fillStyle = color; ctx.fillText(line, x, yy); n++; yy += lh; }
    return yy;
  }
  function closeX(P, action) {
    const { ctx, cw } = P;
    const x = cw - 78, y = 14;
    ctx.strokeStyle = 'rgba(160,210,255,0.8)'; ctx.lineWidth = 2;
    rr(ctx, x, y, 62, 62, 10); ctx.stroke();
    ctx.strokeStyle = '#CFE8FF'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x + 19, y + 19); ctx.lineTo(x + 43, y + 43);
    ctx.moveTo(x + 43, y + 19); ctx.lineTo(x + 19, y + 43);
    ctx.stroke();
    P.regions.push({ id: action, x, y, w: 62, h: 62 });
  }
  function commit(P, sig) { P.sig = sig; P.tex.needsUpdate = true; }

  // ---------- standing-panel placement ----------
  function stand(P, x, z, yBase, yOff, yaw, tilt = -0.10) {
    P.group.position.set(x, yBase, z);
    P.group.rotation.y = yaw;
    P.mesh.position.y = yOff;
    P.mesh.rotation.x = tilt;
    root.add(P.group);
  }
  const arcPos = (r, th) => [Math.sin(th) * r, Math.cos(th) * r];
  // Watchlist tiles ride the TOP of the chart glass, curved with it
  // (C-LO's word, 2026-10-29): each tile sits on the screen's cylinder
  // (axis z 10, radius 27 — just inside the glass surface), yawed to
  // its arc angle so the row bends with the screen.
  function tileArcPos(i) {
    const phi = (i - 3) * 0.354;
    return { x: Math.sin(phi) * 27, z: 10 - Math.cos(phi) * 27, yaw: -phi };
  }

  // ================= DOCKS =================
  // Designed docks, symmetric around the screen's axis: the watchlist
  // tiles arc over the TOP of the chart glass, curved with it; the
  // four board buttons stand in a row on the front deck; LEFT DOCK =
  // market flank panel; RIGHT DOCK = session flank panel; COMMAND
  // ARC = chain plaques + mode dial at its right end; camera presets
  // = 2x2 block, right rim.
  const COL_X = 35, COL_Z = -2;

  // ================= WATCHLIST TILES (arc over the chart glass) =================
  const tiles = {};
  SYMBOLS.forEach((meta, i) => {
    const P = makePanel(5.2, 1.8, 512, 184);
    P.fullAction = 'tile:' + meta.sym;
    const tp = tileArcPos(i);
    stand(P, tp.x, tp.z, 1.8, 33.2, tp.yaw, -0.06);
    tiles[meta.sym] = P;
  });
  function drawTile(P, meta, S, active) {
    const chg = S.price - S.prevDayClose, pct = S.prevDayClose ? (chg / S.prevDayClose) * 100 : 0;
    const sig = `${meta.sym}|${S.price.toFixed(2)}|${pct.toFixed(2)}|${active}`;
    if (sig === P.sig) return;
    frame(P, active ? 'rgba(53,196,255,0.98)' : 'rgba(70,170,255,0.55)');
    if (active) { P.ctx.fillStyle = 'rgba(53,196,255,0.20)'; rr(P.ctx, 3, 3, P.cw - 6, P.ch - 6, 14); P.ctx.fill(); }
    text(P, meta.sym, 24, 47, 48, WHITE);
    text(P, `${chg >= 0 ? '▲' : '▼'} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`, P.cw - 24, 47, 38, chg >= 0 ? UP : DN, 'right');
    text(P, fmtPrice(S.price), 24, 128, 42, '#CFE8FF');
    if (active) text(P, '● LIVE', P.cw - 24, 128, 24, CYAN, 'right');
    commit(P, sig);
  }

  // ================= LEFT FLANK — MARKET PANEL (left dock) =================
  // Live readouts for the SELECTED symbol, all from the feed: structure
  // (EMA stack), momentum (RSI), liquidity (swing / 40-candle range) and
  // an order-flow balance bar from real candle volume. No invented data.
  const flankL = makePanel(8.4, 5.3, 832, 528);
  stand(flankL, -COL_X, COL_Z, 1.8, 4.62 - 1.8, 0.16, -0.04);
  function drawFlankL(F, selected) {
    const S = F.series[selected];
    if (!S || !S.candles.length) return;
    const cs = S.candles, last = cs[cs.length - 1];
    let hi40 = -Infinity, lo40 = Infinity, buyV = 0, sellV = 0;
    for (let i = Math.max(0, cs.length - 40); i < cs.length; i++) { hi40 = Math.max(hi40, cs[i].high); lo40 = Math.min(lo40, cs[i].low); }
    for (let i = Math.max(0, cs.length - 20); i < cs.length; i++) { if (cs[i].close >= cs[i].open) buyV += cs[i].v; else sellV += cs[i].v; }
    const res = S.swingHigh && S.swingHigh > S.price ? S.swingHigh : hi40;
    const sup = S.swingLow && S.swingLow < S.price ? S.swingLow : lo40;
    const buyPct = buyV + sellV > 0 ? Math.round((buyV / (buyV + sellV)) * 100) : 50;
    const sig = `fl|${selected}|${S.candleCount}|${S.rsi.toFixed(0)}|${buyPct}|${res.toFixed(2)}|${sup.toFixed(2)}|${S.lastPattern}`;
    if (sig === flankL.sig) return;
    const P = flankL, { ctx } = P;
    frame(P);
    text(P, `MARKET — ${selected}`, 30, 44, 40, CYAN);
    text(P, S.meta.name.toUpperCase().slice(0, 22), P.cw - 30, 44, 24, DIM, 'right', 400);
    const stack = S.e9 > S.e21 && S.e21 > S.e50 ? 'BULL STACK' : S.e9 < S.e21 && S.e21 < S.e50 ? 'BEAR STACK' : 'MIXED / CHOP';
    const stackCol = stack === 'BULL STACK' ? UP : stack === 'BEAR STACK' ? DN : GOLD;
    text(P, 'STRUCTURE', 30, 108, 24, DIM, 'left', 400);
    text(P, `${stack} · ${S.price > S.e50 ? 'ABOVE' : 'BELOW'} EMA50`, 30, 148, 34, stackCol);
    if (S.lastPattern) text(P, `LAST PATTERN: ${patternName(S.lastPattern)}`, 30, 190, 25, '#9FD8F5', 'left', 400);
    text(P, 'MOMENTUM', 30, 240, 24, DIM, 'left', 400);
    text(P, `RSI ${S.rsi.toFixed(1)}`, 560, 240, 30, S.rsi >= 70 ? DN : S.rsi <= 30 ? UP : WHITE, 'right');
    ctx.fillStyle = 'rgba(70,170,255,0.15)'; rr(ctx, 30, 262, 772, 20, 10); ctx.fill();
    ctx.fillStyle = S.rsi >= 70 ? DN : S.rsi <= 30 ? UP : CYAN;
    rr(ctx, 30, 262, Math.max(14, 772 * (S.rsi / 100)), 20, 10); ctx.fill();
    text(P, 'LIQUIDITY', 30, 330, 24, DIM, 'left', 400);
    const resPct = ((res / S.price) - 1) * 100, supPct = ((sup / S.price) - 1) * 100;
    text(P, `▲ RES ${fmtPrice(res)} (+${resPct.toFixed(2)}%)`, 30, 372, 31, '#FF8FA0');
    text(P, `▼ SUP ${fmtPrice(sup)} (${supPct.toFixed(2)}%)`, 30, 414, 31, '#7DEBB2');
    text(P, `ORDER FLOW — LAST 20 CANDLES`, 30, 466, 24, DIM, 'left', 400);

  // orb rides high (y 10.8, 1.3x scale) so it reads over the plaque arc

  const sbPos = { x: 0, z: 0, y: 10.8 };
  const sbPed = new THREE.Mesh(
    new THREE.CylinderGeometry(2.3, 2.9, 1.3, 28),

  sbGlow.rotation.x = -Math.PI / 2; sbGlow.position.set(sbPos.x, 3.12, sbPos.z); root.add(sbGlow);
  const sbGroup = new THREE.Group();
  sbGroup.position.set(sbPos.x, sbPos.y, sbPos.z); root.add(sbGroup);
  const sbNodes = [];
  {
    const N = 90, GA = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = GA * i;
      sbNodes.push([Math.cos(th) * r * 2.55, y * 2.55, Math.sin(th) * r * 2.55]);

  const sbPointsMat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  {
    const pos = new Float32Array(sbNodes.length * 3), col = new Float32Array(sbNodes.length * 3);
    const cA = [0.21, 0.77, 1.0], cB = [0.65, 0.55, 1.0];
    let seed = 777;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    sbNodes.forEach((p, i) => {
      pos.set(p, i * 3);
      const m = rnd(), c = [cA[0] + (cB[0] - cA[0]) * m, cA[1] + (cB[1] - cA[1]) * m, cA[2] + (cB[2] - cA[2]) * m];
      col.set(c, i * 3);
    });
    const gph = new THREE.BufferGeometry();
    gph.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    gph.setAttribute('color', new THREE.BufferAttribute(col, 3));
    sbGroup.add(new THREE.Points(gph, sbPointsMat));
  }
  const sbLinesMat = new THREE.LineBasicMaterial({ color: 0x8a86ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
  {
    const seg = [];
    for (let i = 0; i < sbNodes.length && seg.length < 170 * 6; i++)
      for (let j = i + 1; j < sbNodes.length; j++) {
        const a = sbNodes[i], b = sbNodes[j];
        const d2 = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
        if (d2 < 1.5 * 1.5) { seg.push(...a, ...b); if (seg.length >= 170 * 6) break; }
      }

    gl.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
    sbGroup.add(new THREE.LineSegments(gl, sbLinesMat));

  const sbRingMat = new THREE.LineBasicMaterial({ color: 0x35C4FF, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });

  const brain = { mode: 'standby', step: 0, doneMask: 0, tests: 0, batches: 0, paths: 0, propId: null, resolution: null, failedStep: 0, holdT: 0, blockT: 0, spin: 0.18 };

  function completeStep(s) {

  function brainEvent(type, p) {
    if (type === 'candidate') {

    } else if (type === 'gatefail') {

      const s = stepFor[p && p.bot] || brain.step || 1;
      completeStep(s);
      brain.failedStep = s;
      brain.mode = 'block'; brain.blockT = 1.6; brain.step = 0; brain.propId = null;
    } else if (type === 'filled') {
      brain.resolution = 'filled';
    } else if (type === 'denied') {
      if (brain.resolution !== 'filled') brain.resolution = 'denied';
    } else if (type === 'rehearsal') {
      brain.tests += 4 * ((p && p.trades) || 0);   // each rehearsal trade = one full 4-gate scenario pass
      if (brain.mode === 'standby') { brain.mode = 'surge'; brain.holdT = 1.4; }

  function brainTick(D) {
    if (!D) return;

    // plaque distinguishes batches run from paths simulated (spec rule).
    if (typeof D.scenarioBatches === 'number') { brain.batches = D.scenarioBatches; brain.paths = D.scenarioPaths || 0; }
    if (brain.mode === 'thinking') {

          // count any the poll raced past (mask-guarded, never double)
          completeStep(1); completeStep(2); completeStep(3);
